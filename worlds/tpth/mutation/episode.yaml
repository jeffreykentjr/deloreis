# Detection corpus — episode-target operators (EXT-F5)
#
# Ported from the fantasy mutation corpus at the pinned SHA. These carry no
# on-disk mutation: the continuity gate synthesizes a violating episode state of
# the declared kind from the live world model and runs the continuity checker.
# In deloreis the analog is an era-anchored episode/scene projected to
# state-at(anchor) and checked against the certain projection (spec 03 §4).
provenance:
  source_repo: "To Pleach the Hedgeway (D-0143) — /home/jeff/Documents/scratch/fantasy"
  pinned_sha: 099e04cdbbbaf644842a2f4b7a23b2235f752311
  source_files:
    - src/fantasy/mutation/operators.py
    - docs/reference/lore-engine-gate-coverage.md
  target: episode
  note: >-
    Synthetic: no file edit. `continuity_kind` selects which violating
    EpisodeState the continuity gate builds from the world model. Registered
    only when the world module is importable.

operators:
  - operator: continuity-world-contradiction
    kernel_outcome: {wave: 3, status: caught, code: factcheck.contradicted, gate: "check_draft() — the episode delta projected as a claim clashes with the certain layer", test: op_continuity_world_contradiction}
    description: An episode establishes a fact whose value contradicts assertable canon.
    seeded_change:
      kind: synthetic
      continuity_kind: world
      note: A synthesized episode delta sets a fact to a value the certain layer denies.
    fantasy_gates: [continuity]
    fantasy_codes: [WORLD_CONTRADICTION]
    expected_catch: [contradiction]
    catch_discriminant: world-contradiction
    side: kernel
    rationale: >-
      The episode's state-at projection contradicts the certain layer; deloreis
      runs the continuity classes against that projection (spec 03 §4).

  - operator: continuity-prior-contradiction
    kernel_outcome: {wave: 3, status: caught, code: continuity.prior-contradiction, gate: "continuity::prior_contradictions() over the episode fold's prior ledger", test: op_continuity_prior_contradiction}
    description: An episode changes a fact from a value that disagrees with the prior episode.
    seeded_change:
      kind: synthetic
      continuity_kind: prior
      note: The episode fold's prior state disagrees with the new episode's value.
    fantasy_gates: [continuity]
    fantasy_codes: [PRIOR_CONTRADICTION]
    expected_catch: [contradiction]
    catch_discriminant: prior-contradiction
    side: kernel
    rationale: >-
      The episode fold runs in production order; a value disagreeing with the
      prior fold head is a contradiction against the running ledger. A story-time
      span (since/until) can legitimize the change — otherwise it is a finding.

  - operator: continuity-unknown-entity
    kernel_outcome: {wave: 3, status: caught, code: continuity.unknown-entity, gate: "check_claims()", test: op_continuity_unknown_entity}
    description: An episode references an entity id canon does not define.
    seeded_change:
      kind: synthetic
      continuity_kind: unknown
      note: The episode names an entity id absent from the compiled world.
    fantasy_gates: [continuity]
    fantasy_codes: [UNKNOWN_ENTITY]
    expected_catch: [reference]
    catch_discriminant: unknown-entity
    side: kernel
    rationale: A reference to an id the world does not define — the same class as a dangling link, at the episode layer.

  - operator: continuity-proposed-as-fact
    kernel_outcome: {wave: 3, status: caught, code: continuity.proposed-as-fact, gate: "check_claims()", test: op_continuity_proposed_as_fact}
    description: An episode asserts proposed/open-question shadow lore as established fact.
    seeded_change:
      kind: synthetic
      continuity_kind: proposed
      note: The episode asserts merely-possible/shadow lore as an established fact.
    fantasy_gates: [continuity]
    fantasy_codes: [PROPOSED_AS_FACT]
    expected_catch: [assertability]
    catch_discriminant: proposed-as-fact
    side: kernel
    rationale: >-
      Merely-possible lore is structurally excluded from the certain projection
      (spec 07 §4); asserting it as fact fails the status gate.
