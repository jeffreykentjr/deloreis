# Detection corpus — draft-target operators (EXT-F5)
#
# Ported from the fantasy mutation corpus at the pinned SHA. Each record seeds a
# violation into a clean draft fixture and names the deloreis kernel check class
# that must flag it. `base_draft` is the fantasy fixture the violation is
# appended to (or edited). See README.md for the taxonomy and the kernel/factory
# vet split (spec 05 §3).
provenance:
  source_repo: "To Pleach the Hedgeway (D-0143) — /home/jeff/Documents/scratch/fantasy"
  pinned_sha: 099e04cdbbbaf644842a2f4b7a23b2235f752311
  source_files:
    - src/fantasy/mutation/operators.py
    - docs/reference/lore-engine-gate-coverage.md
  target: draft
  note: >-
    Draft-target operators check a draft's claims against the compiled world
    (contradiction), the compiled lexicon ban list, the naming layer, the craft
    payload battery, or a factory-side screen (style / allegory explicitness).

operators:
  - operator: contradict-anchor-gender
    kernel_outcome: {wave: 3, status: caught, code: factcheck.contradicted, gate: "check_draft()", test: op_contradict_anchor_gender, note: "certain fact gender(anchor, male) D-0096"}
    description: State the Anchor is a woman (canon:male, D-0096).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] The Anchor was an old woman now, and she was tired."
    fantasy_gates: [factcheck]
    contradicts: "anchor gender (male, D-0096)"
    expected_catch: [contradiction]
    side: kernel
    rationale: The claim contradicts the certain projection of the world.

  - operator: contradict-protagonist-immortal
    kernel_outcome: {wave: 3, status: corpus-gap, code: factcheck.unsupported, gate: "check_draft() flags it, but no rejected-lore citation", test: op_contradict_protagonist_immortal, note: "the vendored constraints: section carries only auditor/demon-king/monster-of-week; adding a D-0067 immortality guardrail upgrades this to a clean contradiction (migration.md §3 corpus-gap)"}
    description: State the protagonist is immortal (rejected as her depth source, D-0067).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] The protagonist was immortal, deathless as the deep stone."
    fantasy_gates: [factcheck]
    contradicts: "protagonist mortality (immortality rejected, D-0067)"
    expected_catch: [contradiction]
    side: kernel
    rationale: Asserts a claim the certain projection denies (a rejected-lore constraint).

  - operator: contradict-hound-mundane
    kernel_outcome: {wave: 3, status: caught, code: continuity.proposed-as-fact, gate: "check_claims()", test: op_contradict_hound_mundane, note: "the hound's nature rests only on shadow (proposed) lore; asserting it settled is the assertability catch"}
    description: Settle the hound's open nature as an ordinary dog (Q-0006 is open).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: The hound is just a dog, nothing more."
    fantasy_gates: [factcheck]
    contradicts: "hound nature (Q-0006 open — asserting settles a tracked debt)"
    expected_catch: [contradiction, assertability]
    side: kernel
    rationale: >-
      Settling an open question in prose asserts merely-possible/undecided lore as
      fact; the certain projection has no such fact, so it reads as a contradiction
      against an open debt.

  - operator: assert-auditor-identity
    kernel_outcome: {wave: 3, status: caught, code: factcheck.contradicted, gate: "check_draft() via the C-store", test: op_assert_auditor_identity, note: "grounded in the vendored constraint no-auditor-concept (D-0009), compiled into the killed-token store"}
    description: Give the protagonist the rejected 'Auditor' identity (D-0009).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] The protagonist had once been an auditor of the order."
    fantasy_gates: [factcheck]
    contradicts: "protagonist identity (Auditor rejected, D-0009)"
    expected_catch: [contradiction]
    side: kernel
    rationale: A rejected-lore constraint denies the claim in the certain projection.

  - operator: assert-demon-king
    kernel_outcome: {wave: 3, status: caught, code: factcheck.contradicted, gate: "check_draft() via the C-store", test: op_assert_demon_king, note: "grounded in the vendored constraint no-singular-demon-king (D-0010), compiled into the killed-token store as a phrase"}
    description: "Put a demon king atop the empire (rejected: it is a system, D-0010)."
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] The empire answered, in the end, to a demon king."
    fantasy_gates: [factcheck]
    contradicts: "empire nature (a system, not a person; demon-king rejected, D-0010)"
    expected_catch: [contradiction]
    side: kernel
    rationale: A rejected-lore constraint denies the claim.

  - operator: assert-musical-magic
    kernel_outcome: {wave: 3, status: corpus-gap, code: factcheck.unsupported, gate: "check_draft() flags it, but no rejected-lore citation", test: op_assert_musical_magic, note: "no vendored constraint carries the D-0002 rejection; adding one upgrades this to a clean contradiction"}
    description: Make the magic musical/acoustic (rejected mechanic, D-0002).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] The magic was musical: a harmonic resonance sung into the stone."
    fantasy_gates: [factcheck]
    contradicts: "magic mechanic (musical/acoustic rejected, D-0002)"
    expected_catch: [contradiction]
    side: kernel
    rationale: A rejected-lore constraint denies the claim.

  - operator: assert-narrator-ticking-clock
    kernel_outcome: {wave: 3, status: corpus-gap, code: factcheck.unsupported, gate: "check_draft() flags it, but no rejected-lore citation", test: op_assert_narrator_ticking_clock, note: "no vendored constraint carries the D-0104 rejection; the corpus rationale notes deloreis is even stronger in principle (the narrator era is inert by construction), but that structural exclusion is a TIME-lane property, not a wave-3 CHECK-1 catch"}
    description: Give the narrator's frame a ticking clock (rejected, D-0104).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: >-
        [NARRATOR] The chronicle is running out of time; the threads must be read
        before it is too late.
    fantasy_gates: [factcheck]
    contradicts: "narration frame (inert vantage; ticking clock rejected, D-0104)"
    expected_catch: [contradiction]
    side: kernel
    rationale: >-
      Stronger in deloreis: the narrator's era is inert by construction (spec 03
      §1.iii, D-0104) — narration-frame dynamics are a type error, and premise
      selection structurally excludes narrators-era facts from any cast pool.

  - operator: modern-vocab-algorithm
    kernel_outcome: {wave: 3, status: caught, code: name.banned-in-name, gate: "vet_candidate() against the compiled ban list", test: op_modern_vocab_algorithm}
    description: Leak a banned technology word ('algorithm') into a scene.
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] The clerks fed the numbers to the algorithm and waited."
    fantasy_gates: [allegory]
    expected_catch: [lexicon-ban]
    side: kernel
    rationale: >-
      `banned algorithm` is a cited lexicon fact (spec 05 §4); the allegory is
      structural, never lexical, so the word fails the compiled ban scan in-kernel.

  - operator: modern-vocab-carbon
    kernel_outcome: {wave: 3, status: caught, code: name.banned-in-name, gate: "vet_candidate() against the compiled ban list", test: op_modern_vocab_carbon}
    description: Leak a modern-ecology word ('carbon') into dialogue.
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: The mines choke the whole valley with carbon and ash."
    fantasy_gates: [allegory]
    expected_catch: [lexicon-ban]
    side: kernel
    rationale: A modern-register term barred by the compiled lexicon ban list.

  - operator: killed-name-elara
    kernel_outcome: {wave: 3, status: factory, code: null, gate: "no kernel catch — CORRECTION: side kernel→factory", test: op_killed_name_elara, note: "Elara is NOT in the vendored killed_tokens.yaml registry; it lives only in ai_tics.yaml, and ai-tics stay factory-side by law (migration.md §2 work-list; spec 05 §3). Contrast killed-name-silas: Silas IS in the registry (Q-0015), so it re-homes to the kernel. Registry membership — not 'is it an AI-tic' — is the ground truth for the kernel/factory line."}
    description: Use the killed AI-default name 'Elara' in a scene.
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: A trader named Elara came through the pass last spring."
    fantasy_gates: [style, naming]
    expected_catch: [killed-token]
    also_factory: [style-slop]
    side: kernel
    rationale: >-
      'Elara' is a registered killed token (AI-default name); the naming layer
      refuses its return in-kernel. The factory style screen also flags it as an
      AI-tic (spec 05 §3, factory-side) — a second, non-gating screen.

  - operator: killed-name-silas
    kernel_outcome: {wave: 3, status: caught, code: killed-token, gate: "check_draft() over draft.names against the vendored killed registry", test: op_killed_name_silas, note: "Silas is in killed_tokens.yaml (Q-0015)"}
    description: Use the AI-tic name 'Silas' (a documented naming reject) in a scene.
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: The bailiff Silas waved us through the checkpoint."
    fantasy_gates: [naming]
    expected_catch: [killed-token]
    side: kernel
    rationale: A registered killed token; the kernel refuses its return with a pointer to lineage.

  - operator: killed-name-irondale
    kernel_outcome: {wave: 3, status: caught, code: killed-token, gate: "check_draft() over draft.names", test: op_killed_name_irondale, note: "Irondale is in killed_tokens.yaml (D-0101)"}
    description: "Use the killed place-name 'Irondale' (Game-of-Thrones collision)."
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: We came down through the town of Irondale before the rain."
    fantasy_gates: [naming]
    expected_catch: [killed-token]
    side: kernel
    rationale: A registered killed place-name; refused in-kernel.

  - operator: killed-name-doom-wight
    kernel_outcome: {wave: 3, status: caught, code: killed-token, gate: "check_draft() over draft.names", test: op_killed_name_doom_wight, note: "doom-wight is in killed_tokens.yaml (D-0097), a phrase-mode token"}
    description: "Use the killed portent name 'Doom-wight' (simplistic doom-and-gloom)."
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: The old folk still fear the Doom-wight out on the moor."
    fantasy_gates: [naming]
    expected_catch: [killed-token]
    side: kernel
    rationale: A registered killed portent name; refused in-kernel.

  - operator: wrong-register-name
    kernel_outcome: {wave: 3, status: caught, code: name.phonotactics, gate: "language::check() — register-fit is a compile verdict (05 §2)", test: op_wrong_register_name, note: "the imperial 'qu' cluster marks the surface as not of the crag tongue"}
    description: "Name a crags-region place in the imperial register ('Aquilium')."
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "[NARRATOR] Beyond the ridge lay the crag-town of Aquilium, half in ruin."
    fantasy_gates: [naming]
    naming_probe: {name: Aquilium, kind: place, register: crags, tier: secondary}
    expected_catch: [register-fit]
    side: kernel
    rationale: >-
      Register-fit is a compile verdict (spec 05 §2): an imperial-register form in
      a crags-region place fails the register's phonotactics / name-kind patterns.

  - operator: slop-cluster
    kernel_outcome: {wave: 3, status: factory, code: null, gate: "no kernel catch (correct) — an AI-slop screen is a machine-tell about OUR world (05 §3), factory-side by law", test: op_slop_cluster, note: "asserted as a no-catch so a future kernel that wrongly gated slop prose would fail here"}
    description: "Inject an AI-slop cluster: a default name, a not-X-but-Y, and a stock beat."
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: >-
        APPRENTICE: Elara felt her heart pound, and it was not fear, but something
        else. Her voice was barely above a whisper.
    fantasy_gates: [style]
    expected_catch: [style-slop]
    side: factory
    kernel_gated: false
    rationale: >-
      An AI-slop screen is a fact about OUR world's machine-generation tells, not
      the story's world; it stays factory-side and must never gate assertability
      (spec 05 §3). PROOF-1 asserts no kernel catch here — it is a factory screen.

  - operator: allegory-wink
    kernel_outcome: {wave: 3, status: factory, code: null, gate: "no kernel catch (correct) — genre-taste judgment (05 §3 principle); no allegory.* kernel class exists", test: op_allegory_wink, note: "distinct from the compiled lexical bans (modern-vocab-*), which ARE kernel facts"}
    description: "Have a character wink at the allegory ('the system is rigged')."
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: The whole system is rigged, and everyone knows it."
    fantasy_gates: [allegory]
    expected_catch: [allegory-explicitness]
    side: factory
    kernel_gated: false
    rationale: >-
      Allegory explicitness/winking is a coherence/taste judgment about our genre
      expectations, not a story-world fact; it is a factory-side screen (spec 05
      §3 principle), not a kernel assertability gate. Distinct from the compiled
      lexical bans (modern-vocab-*), which ARE kernel facts.

  - operator: crowd-scene-cast
    kernel_outcome: {wave: 3, status: pending-gate, code: null, gate: "none at wave 3 — the craft payload/conformance battery lands at CRAFT-2/PAY-2 (wave 4)", test: op_crowd_scene_cast, note: "xfail-strict: WorldModel.craft_rules is empty and no craft.* finding class exists yet; the day CRAFT-2 lands a cast-per-scene rule, this flips"}
    description: Cram a fifth and sixth speaking voice into one scene (past the ear's limit).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: |
        PROTAGONIST: We cross before the light is gone.

        BAILIFF: Halt there. Show me your papers.

        FERRYMAN: The toll is two coins a head, rain or no rain.

        DROVER: The east road is under water past the mill.
    fantasy_gates: [craft]
    craft_check: cast_per_scene
    expected_catch: [craft-payload]
    catch_discriminant: cast-per-scene
    side: kernel
    rationale: >-
      A craft payload/conformance finding (spec 06): the cast-per-scene rule joins
      the scene's speaking voices against the ear's limit.

  - operator: as-you-know-bob-leak
    kernel_outcome: {wave: 3, status: pending-gate, code: null, gate: "none at wave 3 — craft payload battery lands at CRAFT-2/PAY-2 (wave 4)", test: op_as_you_know_bob_leak, note: "xfail-strict pending the as-you-know-bob craft rule"}
    description: Inject maid-and-butler exposition (telling another what both already know).
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: "APPRENTICE: As you know, the empire taxes every ford between the hills."
    fantasy_gates: [craft]
    craft_check: as_you_know_bob
    expected_catch: [craft-payload]
    catch_discriminant: as-you-know-bob
    side: kernel
    rationale: A craft payload finding — exposition told to a character who already knows it.

  - operator: ornate-tag-cluster
    kernel_outcome: {wave: 3, status: pending-gate, code: null, gate: "none at wave 3 — craft payload battery lands at CRAFT-2/PAY-2 (wave 4)", test: op_ornate_tag_cluster, note: "xfail-strict pending the said-tag-ratio craft rule"}
    description: Swap a run of said/asked for murmured/hissed/growled, sinking the said-ratio.
    base_draft: clean-dialogue.md
    seeded_change:
      kind: edits
      edits:
        - {from: "the girl said", to: "the girl whispered"}
        - {from: "the old man said", to: "the old man growled"}
        - {from: "the girl asked", to: "the girl hissed"}
    fantasy_gates: [craft]
    craft_check: said_tag_ratio
    expected_catch: [craft-payload]
    catch_discriminant: said-tag-ratio
    side: kernel
    rationale: A craft payload finding — ornate dialogue tags drop the said-ratio below the floor.

  - operator: paraphrased-contradiction
    kernel_outcome: {wave: 3, status: miss, code: null, gate: "no kernel catch (the honest deterministic hole)", test: op_paraphrased_contradiction, note: "xfail-strict: a cue-less paraphrase shares no symbol with the shadow slot, so the offline checker is structurally indistinguishable from legitimate new lore; the non-gating cross-family semantic judge is the only closer"}
    description: Contradict the hound's open nature by paraphrase, matching no fact cue.
    base_draft: clean-scene.md
    seeded_change:
      kind: append
      text: >-
        [NARRATOR] The hound was really no more than a clever herding beast, bred
        and trained like any other on the fells.
    fantasy_gates: [factcheck]
    expected_catch: [contradiction]
    side: kernel
    kernel_gated: false
    expected_miss: true
    rationale: >-
      The intended class is contradiction (the paraphrase denies the hound's open
      nature), but the deterministic kernel cannot reach it — see miss_reason.
    miss_reason: >-
      The deterministic cue-miner only fires on a fact's surface cues; a paraphrase
      outside the cue list slips past. Closing it needs the opt-in cross-family
      semantic judge (--live), which never runs in CI. In deloreis the kernel is
      offline and model-free by law, so the same paraphrase is a structural miss at
      the gating layer; the semantic judge is a non-gating factory lane. This is the
      one honest hole — carried as an xfail-strict analog, never hidden.
