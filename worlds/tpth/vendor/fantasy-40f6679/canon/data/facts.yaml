# =============================================================================
# facts.yaml — hand-seeded atomic facts for the Intermediate World Model.
#
# Reviewed and promoted from the worldsmith draft 2026-07-06. Schema:
# fantasy.world.factsfile.FactsDoc. Every ratified/provisional/rejected row cites
# its decision id(s), exactly as canon/SCHEMA.md requires of prose and the other
# data files. Values are lowercase-hyphen tokens so they survive Dialog emission.
#
# Extracted from the RATIFIED/PROVISIONAL corpus after the D-0112..D-0127 batch.
# Statuses were cross-checked against the canon section markers, not guessed:
#   - region existence/names ...... ratified (D-0101, D-0108, D-0111)
#   - map shape / adjacency ....... ratified (D-0119)
#   - biome descriptors / origins . provisional (D-0081)
# Proposed rows (hound source, narrator name, deep-zone sketches) are the SHADOW
# layer: queryable, never assertable, never emitted — they exist here so the
# continuity checker can catch an episode that asserts them as settled.
# =============================================================================

