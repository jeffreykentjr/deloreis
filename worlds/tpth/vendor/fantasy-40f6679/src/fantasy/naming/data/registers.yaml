  old_tongue:
    id: old_tongue
    label: The Old Tongue
    real_basis: Old English + Old Norse mythic/sacral register (shared deep past); elder-Celtic layer
    biome: the ancient formal language of the proofs; never conversational (chanted, quoted, woven)
    diction: >
      Ancient, formal, weighty. Monosyllabic Germanic roots for fate, law, binding, and
      memory; used for magic terms, sacred orders, and concepts, never for small talk.
    phonotactics:
      vowels: [a, e, i, o, u, y, ea, ae]
      endings: [d, th, g, n, ne, rd, ld]
      foreign: [us, um, ium, os, nen, ll, dd, ff, "'"]
      signature: [wyrd, frith, doom, ward, moot, thing, orlog, geld]
      max_cluster: 3
      stress: initial
    patterns:
      concept:
        - {slots: [old-element], weight: 3}
        - {slots: [old-element, old-element], weight: 1}
      organization:
        - {slots: [org-head, old-element], weight: 1}
      person.given:
        - {slots: [old-element], weight: 1}
    elements:
      - {form: wyrd, gloss: fate as accumulated consequence, root: OE wyrd, lang: Old English, role: old-element, source: https://en.wiktionary.org/wiki/wyrd}
      - {form: frith, gloss: peace, protection, right relation, root: OE frith, lang: Old English, role: old-element, source: https://en.wiktionary.org/wiki/fri%C3%BE}
      - {form: orlog, gloss: primal law, fate, root: ON orlog, lang: Old Norse, role: old-element, source: https://en.wiktionary.org/wiki/%C3%B8rl%C7%ABg}
      - {form: doom, gloss: judgment, law, decree, root: OE dom, lang: Old English, role: old-element, source: https://www.etymonline.com/word/doom}
      - {form: ward, gloss: guarding, protection, keeper, root: OE weard, lang: Old English, role: old-element, source: https://www.etymonline.com/word/ward}
      - {form: troth, gloss: faithfulness, a pledge, root: OE treowth, lang: Old English, role: old-element, source: https://www.etymonline.com/word/troth}
