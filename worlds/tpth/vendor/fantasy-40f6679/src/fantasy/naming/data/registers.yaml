  crags:
    id: crags
    label: The Slag-Peaks
    real_basis: Old Norse (Norse-settled northern England), widened to Slavic
    biome: strip-mined mountains, soot air, violent hot-tempered Wyrd
    diction: >
      Guttural, percussive, forge-shouted. Hard codas and blunt compounds; the anchor's
      home register. Byname culture is strong (the Red, Ironside, Bloodaxe).
    phonotactics:
      vowels: [a, o, u, ei, au, ja, jo]
      endings: [by, thorpe, thwaite, beck, fell, gill, dale, garth, howe, scar]
      foreign: [ll, dd, ff, ium, os, nen, aber, llan, "æ"]
      signature: [by, thorpe, thwaite, beck, fell, thor, ulf, stein, grim]
      max_cluster: 4
      stress: initial
    patterns:
      person.given:
        - {slots: [given-proto, given-deutero], weight: 2}
