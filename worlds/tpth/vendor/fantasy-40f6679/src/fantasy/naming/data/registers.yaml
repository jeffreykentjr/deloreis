      - {form: Rest, gloss: cessation of toil (permanent), root: OE raest, lang: Old English, role: org-head, source: https://en.wiktionary.org/wiki/rest}

  chalk:
    id: chalk
    label: The Chalk Uplands
    real_basis: Old English / West Saxon (Anglo-Saxon)
    biome: arid limestone plateaus where the Wyrd runs thin; the imperial core
    diction: >
      A clipped, plain, transactional vernacular descended from the rulers' tongue.
      Place-names read like the English chalk downs: hard, geometric, unexotic.
    phonotactics:
      vowels: [a, e, o, u, ea, ae, y]
      endings: [ton, ham, don, bury, combe, bourne, leigh, mere, stan, worth]
      foreign: [ll, dd, ff, kj, fj, os, nen, oo, "'"]
      signature: [ton, ham, don, bury, wic, stan, ead, wulf, aethel]
      max_cluster: 3
      stress: initial
    patterns:
      person.given:
        - {slots: [given-simple], weight: 3}
        - {slots: [given-proto, given-deutero], weight: 2}
      person.byname:
        - {slots: [byname], weight: 1}
      place:
        - {slots: [place-qualifier, place-generic], weight: 3}
        - {slots: [given-proto, place-generic], weight: 1}
    elements:
      - {form: ton, gloss: farmstead, estate, village, root: OE tun, lang: Old English, role: place-generic, source: https://en.wiktionary.org/wiki/-ton}
      - {form: ham, gloss: homestead, village, root: OE ham, lang: Old English, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: wick, gloss: dwelling, specialised or trading farm, root: OE wic, lang: Old English, role: place-generic, source: https://en.wiktionary.org/wiki/wic}
      - {form: bury, gloss: fortified place, stronghold, root: OE burh, lang: Old English, role: place-generic, source: https://en.wiktionary.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: don, gloss: hill, down, open upland, root: OE dun, lang: Old English, role: place-generic, source: https://en.wiktionary.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: combe, gloss: short deep valley, hollow, root: OE cumb, lang: Old English, role: place-generic, source: https://en.wiktionary.org/wiki/cumb}
      - {form: bourne, gloss: stream, brook, root: OE burna, lang: Old English, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: leigh, gloss: woodland clearing, glade, root: OE leah, lang: Old English, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: mere, gloss: lake, pool, pond, root: OE mere, lang: Old English, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: stow, gloss: assembly or holy place, root: OE stow, lang: Old English, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: worth, gloss: enclosure, enclosed homestead, root: OE worth, lang: Old English, role: place-generic, source: https://en.wiktionary.org/wiki/wor%C3%BEig}
      - {form: ford, gloss: river crossing, root: OE ford, lang: Old English, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: chalk, gloss: chalk, limestone, root: OE cealc, lang: Old English, role: place-qualifier, source: https://en.wiktionary.org/wiki/cealc}
      - {form: cold, gloss: cold, root: OE cald, lang: Old English, role: place-qualifier, source: https://en.wiktionary.org/wiki/cald}
