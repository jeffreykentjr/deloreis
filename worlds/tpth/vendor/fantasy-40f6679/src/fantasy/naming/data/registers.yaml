  lowlands:
    id: lowlands
    label: The Drowned Parishes
    real_basis: Brythonic (Welsh / Cornish) with Gaelic; wet and vowel-heavy
    biome: peat bogs and flooded parishes under acidic fog; the agricultural heartland
    diction: >
      Breathy, vowel-heavy, water-over-stones. Double consonants and soft mutations;
      names flow. The apprentice's ear switches into this register as camouflage.
    phonotactics:
      vowels: [a, e, i, o, u, w, y, wy, aw, yw]
      endings: [aber, llan, nant, cwm, pwll, tref, ros, wern]
      foreign: [us, um, ium, ton, by, thw, os, nen, kj]
      signature: [ll, dd, ff, aber, llan, nant, pen, cwm, wern]
      max_cluster: 3
      stress: penultimate
    patterns:
      person.given:
        - {slots: [given-simple], weight: 1}
      person.byname:
        - {slots: [byname], weight: 1}
      place:
        - {slots: [place-generic, place-qualifier], weight: 3}
        - {slots: [place-generic], weight: 1}
    elements:
      - {form: aber, gloss: river mouth, confluence, root: W aber, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: llan, gloss: church enclosure, parish, root: W llan, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: nant, gloss: brook, stream, small valley, root: W nant, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: cwm, gloss: bowl-shaped valley, root: W cwm, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: pwll, gloss: pool, pond, root: W pwll, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/List_of_generic_forms_in_place_names_in_the_United_Kingdom_and_Ireland}
      - {form: pen, gloss: head, top, headland, root: W pen, lang: Welsh, role: place-qualifier, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: tref, gloss: homestead, town, settlement, root: W tref/tre, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: rhos, gloss: moor, heath, root: W rhos, lang: Welsh, role: place-generic, source: https://en.wiktionary.org/wiki/rhos}
      - {form: gwern, gloss: alder-grove, marsh, root: W gwern, lang: Welsh, role: place-generic, source: https://en.wiktionary.org/wiki/gwern}
      - {form: cors, gloss: bog, fen, root: W cors, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: morfa, gloss: salt marsh, root: W morfa, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
      - {form: coed, gloss: wood, forest, root: W coed, lang: Welsh, role: place-generic, source: https://en.wikipedia.org/wiki/Welsh_toponymy}
