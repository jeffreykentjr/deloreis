# Per-register naming profiles for the naming oracle.
#
# One profile per linguistic zone of the world (canon/geography/regions.md +
# canon/language/naming.md). Each carries: a real-world basis, diction notes (how the
# register sounds in speech — feeds future dialogue work), phonotactics (used by the
# register-fit and pronounceability checks), pattern grammars per name kind (used by
# the composition engine), and a lexicon of real, glossed, cited name ELEMENTS.
#
# Element roles:
#   place-generic   settlement/terrain generic, usually a suffix (-ton, -beck, aber-)
#   place-qualifier descriptive first element (cold, white, salt, oak, iron)
#   given-proto     first element of a dithematic personal name
#   given-deutero   second element of a dithematic personal name
#   given-simple    a standalone given-name root
#   byname          descriptive/occupational byname (the Red, Ironside)
#   patronymic      son/daughter marker (-son, ap-, mac-)
#   org-head        institution head-noun (Register, Assize, Order)
#   org-domain      what an institution governs (census, tithe, measure)
#   old-element     sacral/old-tongue root, for concepts and magic terms
#
# Sourcing: see docs/research/RR-003-naming.md. Each element cites the page its gloss came
# from. Anchoring is British-Isles-first, widening to Northern Europe.

registers:

  imperial:
    id: imperial
    label: The Imperial Tongue
    real_basis: Latin of Roman Britain, widened to Old High German / Frankish officialdom
    biome: the rulers' administrative and legal register (not a biome; the empire's own tongue)
    diction: >
      Clipped, transactional, Latinate. Rich in words for debt, measure, and office;
      poor in words for mercy. Names of institutions and law read like inventory.
    phonotactics:
      vowels: [a, e, i, o, u]
      endings: [us, um, a, io, or, ex, ium, arium]
      foreign: [ll, dd, ff, thw, kj, "æ", "'", oo, yr]
      signature: [us, um, ium, or, ex, cens, lex, ord]
      max_cluster: 3
      stress: penultimate
    patterns:
      person.given:
        - {slots: [given-proto, given-deutero], weight: 2}
        - {slots: [given-simple], weight: 2}
      person.byname:
        - {slots: [byname], weight: 1}
      place:
        - {slots: [place-qualifier, place-generic], weight: 2}
        - {slots: [place-generic], weight: 1}
      organization:
        - {slots: [org-head], weight: 4}
        - {slots: [org-head, org-domain], weight: 1}
      concept:
        - {slots: [org-domain], weight: 1}
    elements:
      - {form: lex, gloss: law, statute, root: L lex/legis, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/lex}
      - {form: census, gloss: census, register of persons and property, root: L census, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/census}
      - {form: ordo, gloss: order, rank, class, root: L ordo/ordinis, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/ordo}
      - {form: tabula, gloss: writing tablet, record, root: L tabula, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/tabula}
      - {form: ratio, gloss: reckoning, account, reason, root: L ratio/rationis, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/ratio}
      - {form: fiscus, gloss: purse, the imperial treasury, root: L fiscus, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/fiscus}
      - {form: mensura, gloss: measure, measuring, standard, root: L mensura, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/mensura}
      - {form: pondus, gloss: weight, load, burden, root: L pondus/ponderis, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/pondus}
      - {form: debitum, gloss: debt, thing owed, root: L debitum, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/debitum}
      - {form: tributum, gloss: tribute, tax, root: L tributum, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/tributum}
      - {form: vectigal, gloss: tax, public revenue, root: L vectigal, lang: Latin, role: org-domain, source: https://en.wiktionary.org/wiki/vectigal}
      - {form: curia, gloss: council house, court, root: L curia, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/curia}
      - {form: edictum, gloss: edict, decree, root: L edictum, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/edictum}
      - {form: arca, gloss: chest, coffer, strongbox, root: L arca, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/arca}
      - {form: vallum, gloss: rampart, palisade, root: L vallum, lang: Latin, role: place-generic, source: https://en.wiktionary.org/wiki/vallum}
      - {form: castrum, gloss: fort, camp, root: L castrum (-> -chester), lang: Latin, role: place-generic, source: https://en.wiktionary.org/wiki/castrum}
      - {form: colonia, gloss: colony, chartered settlement, root: L colonia, lang: Latin, role: place-generic, source: https://en.wikipedia.org/wiki/Colonia_(Roman)}
      - {form: praetorium, gloss: governor's seat, root: L praetorium, lang: Latin, role: place-generic, source: https://en.wikipedia.org/wiki/Praetorium}
      - {form: Magister, gloss: master, chief, director, root: L magister, lang: Latin, role: given-simple, source: https://en.wiktionary.org/wiki/magister, gender: male}
      - {form: Quaestor, gloss: magistrate of public finance, root: L quaestor, lang: Latin, role: given-simple, source: https://en.wiktionary.org/wiki/quaestor, gender: male}
      - {form: Livia, gloss: (Roman gens; envious/bluish), root: L Livia, lang: Latin, role: given-simple, gender: female, source: https://www.behindthename.com/name/livia}
      - {form: Marcia, gloss: (Roman gens; of Mars), root: L Marcia, lang: Latin, role: given-simple, gender: female, source: https://www.behindthename.com/name/marcia}
      - {form: Valeria, gloss: (Roman gens; to be strong), root: L Valeria, lang: Latin, role: given-simple, gender: female, source: https://www.behindthename.com/name/valeria}
      - {form: Corva, gloss: raven (gens-style family name), root: L corvus, lang: Latin, role: byname, source: https://en.wiktionary.org/wiki/corvus}
      - {form: Valla, gloss: rampart (gens-style family name), root: L vallum, lang: Latin, role: byname, source: https://en.wiktionary.org/wiki/vallum}
      - {form: Nerva, gloss: (Roman cognomen), root: L Nerva, lang: Latin, role: byname, source: https://en.wikipedia.org/wiki/Nerva}
      - {form: Diet, gloss: people, folk, root: OHG diot, lang: Old High German, role: given-proto, source: https://en.wiktionary.org/wiki/diot}
      - {form: berht, gloss: bright, famous, root: OHG beraht, lang: Old High German, role: given-deutero, source: https://www.behindthename.com/element/beraht, gender: male}
      - {form: wald, gloss: rule, power, root: OHG wald, lang: Old High German, role: given-deutero, source: https://en.wiktionary.org/wiki/Reconstruction:Proto-West_Germanic/wald, gender: male}
      - {form: hard, gloss: hard, firm, hardy, root: OHG hart, lang: Old High German, role: given-deutero, source: https://www.behindthename.com/element/hard, gender: male}
      - {form: rich, gloss: ruler, mighty, root: OHG rihhi, lang: Old High German, role: given-deutero, source: https://www.behindthename.com/element/ric, gender: male}
      - {form: Adel, gloss: noble (Frankish proto-element), root: OHG adal, lang: Old High German, role: given-proto, source: https://www.behindthename.com/element/adal}
      - {form: Regin, gloss: counsel, the ruling powers, root: OHG ragin, lang: Old High German, role: given-proto, source: https://en.wiktionary.org/wiki/regin}
      - {form: cald, gloss: cold, root: OE/Frank cald, lang: Latinate, role: place-qualifier, source: https://en.wiktionary.org/wiki/census}
      - {form: alba, gloss: white, root: L albus, lang: Latin, role: place-qualifier, source: https://en.wiktionary.org/wiki/lex}
      - {form: Magnus, gloss: great (cognomen byname), root: L magnus, lang: Latin, role: byname, source: https://en.wiktionary.org/wiki/magnus}
      - {form: Severus, gloss: stern, severe (cognomen byname), root: L severus, lang: Latin, role: byname, source: https://en.wiktionary.org/wiki/severus}
      - {form: Charter, gloss: a sealed grant of law/right, root: L charta, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/charter}
      - {form: Tithe, gloss: the tenth taken in tax, root: OE teotha, lang: Old English, role: org-head, source: https://en.wiktionary.org/wiki/tithe}
      - {form: Rolls, gloss: the rolls of record, root: L rotulus, lang: Latin, role: org-head, source: https://en.wiktionary.org/wiki/rolls}
      - {form: Reckoning, gloss: the account, the settling, root: OE gerecenian, lang: Old English, role: org-head, source: https://en.wiktionary.org/wiki/reckoning}
