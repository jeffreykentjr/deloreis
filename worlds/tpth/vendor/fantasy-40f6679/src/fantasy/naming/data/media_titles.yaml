# Contemporary same-medium title-collision list (D-0101 follow-up).
#
# The deterministic franchise list (franchise_names.yaml) covers big FICTIONAL IP by
# in-world entity; THIS file covers real, currently-active TITLES a new audio-drama
# fantasy series could be confused with or accused of copying — fiction podcasts /
# audio dramas (the direct competitors), recent fantasy novels, and fantasy TV. Matched
# with the same normalized machinery: an exact normalized whole-title match FAILs a
# title candidate (WARNs other kinds); a near-miss or a shared distinctive multi-word
# phrase WARNs. New titles launch constantly — re-check finalists on Apple Podcasts /
# Spotify / Goodreads before locking (see docs/reference/naming-workflow.md).
#
# `register_adjacent` are the highest-confusion neighbors for THIS show's flavour
# (pre-modern, animist, folk-horror, bog/salt/rust, British-Isles) — flagged with a
# louder note. Avoid the "The [Noun] Verses/Gods/Ships/Tomb" pattern and the
# salt/silt/bog/reed/mire + god/verse/tide field: it now reads as The Silt Verses.

register_adjacent:
  - {title: The Silt Verses, medium: podcast, note: "folk-horror, outlawed river-gods, bog/reed/salt register — the single closest tonal neighbour."}
  - {title: Old Gods of Appalachia, medium: podcast, note: "eldritch Appalachian folk horror; the 'Old Gods of …' framing reads as direct imitation."}
  - {title: Camlann, medium: podcast, note: "Welsh Arthurian folklore post-apocalypse — extremely register-adjacent (also a real battle site)."}
  - {title: I Am In Eskew, medium: podcast, note: "living-city weird horror (Silt Verses creators)."}
  - {title: The Bear and the Nightingale, medium: novel, note: "Slavic folk, fading old spirits."}
  - {title: Piranesi, medium: novel, note: "labyrinth/animist/tide register."}
  - {title: Starve Acre, medium: novel, note: "English folk horror, moors and oak."}
  - {title: The Buried Giant, medium: novel, note: "post-Arthurian mist and memory."}
  - {title: The Bone Ships, medium: novel, note: "salt/sea/bone register; avoid 'The [Noun] Ships'."}
  - {title: Britannia, medium: tv, note: "ancient Britain, Celtic druids, folk mysticism."}
  - {title: Weyward, medium: novel, note: "Cumbrian witch folk horror; 'Weyward' ~ 'Wayward'/'Wyrd'."}
  - {title: The Wyrd Side, medium: podcast, note: "folk-horror show whose name is built on 'Wyrd'."}
  # title-round-2 empirical finds (docs/rulings/RQ-005-title-round-002.md §sources)
  - {title: The Wyrd Way, medium: podcast, note: "TWO active podcasts of this name — a direct hit for any 'Wyrd'-built title (title-002)."}
  - {title: The Way of Wyrd, medium: novel, note: "Brian Bates novel — another 'Wyrd' collision (title-002)."}
  - {title: The Quiet Ground, medium: podcast, note: "active podcast; avoid 'The Quiet …' (title-002)."}
  - {title: The Waking Land, medium: novel, note: "Callie Bates novel; folk/land register (title-002)."}
  - {title: Cities of the Weft, medium: novel, note: "weave/weft register — adjacent to the order's loom motif (title-002)."}

