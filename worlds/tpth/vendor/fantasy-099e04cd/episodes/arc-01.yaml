  - ordinal: 11
    episode_id: arc1.ep11
    title: Four Ways to Work
    draft_mode: new_outline_then_draft
    outline_status: new_typed_outline_required
    objective: Complete one circuit only by allowing each member's limit to change the plan.
    entry_state: The four have proved a duplicated burden but still cannot keep a whole round together.
    required_causal_beats:
      - The attempted circuit exposes four different limits rather than one weak member.
      - Each limit causes a concrete revision to the plan.
      - The revised circuit succeeds without a heroic override.
      - A working household shape appears without a family declaration.
    speaking_cast: [Narrator, Aalto, Enfys, Geir]
    relationship_phase: working_household_not_family
    retained_gain: A repeatable four-person circuit whose method depends on limits being admitted.
    next_motion: A new storm tests whether the distributed method holds beyond a single successful round.
    prohibitions:
      - Do not declare found family, permanent belonging, or unanimous trust.
      - Do not let one person save the circuit by overriding the others.
      - Bramble never speaks and receives no translated thoughts.
      - Do not import requirements from an earlier episode.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/ARC-01.md
        sha256: c34b59be9bf47cb58362126a6c1dc8589bc682f0dc39458d8ead4cec65e69444
        role: accepted_causal_map
  - ordinal: 12
    episode_id: arc1.ep12
    title: The Eave Holds Differently
    draft_mode: new_outline_then_draft
    outline_status: new_typed_outline_required
    objective: Test distributed routes and duties in a new storm and close the opening threshold without heroism.
    entry_state: The four have one repeatable circuit and a working household shape that has not been declared family.
    required_causal_beats:
      - A new storm tests the distributed routes and duties.
      - Each member's bounded work matters; no single hero carries the threshold.
      - The opening eave holds because the surrounding conditions and method changed.
      - The valley retains the repeatable method after the crew's immediate work.
    speaking_cast: [Narrator, Aalto, Enfys, Geir]
    relationship_phase: distributed_crew_bounded_belonging
    retained_gain: A storm-tested method, a differently held eave, and local knowledge that survives the crew's absence.
    next_motion: Arc 1 closes with the core configuration ready for the adventure proper, not with every relationship resolved.
    prohibitions:
      - Do not resolve the wider system, Geir and Enfys's history, or every open promise.
      - Do not make the storm a heroic final battle.
      - Do not declare the four a permanent family.
      - Do not import requirements from an earlier episode.
    source_digests:
