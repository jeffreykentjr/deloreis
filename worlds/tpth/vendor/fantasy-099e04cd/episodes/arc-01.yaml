  - ordinal: 10
    episode_id: arc1.ep10
    title: The Same Load Twice
    draft_mode: new_outline_then_draft
    outline_status: new_typed_outline_required
    objective: Compare two materially marked obligations and prove that the same burden was assigned twice.
    entry_state: Four useful bodies share one completed brace, incomplete trust, and old history that disrupts timing.
    required_causal_beats:
      - The four compare two materially marked obligations.
      - Material evidence proves a duplicated burden.
      - Old history disrupts the timing of the work.
      - The four become useful together but cannot yet keep a whole round.
    speaking_cast: [Narrator, Aalto, Enfys, Geir]
    relationship_phase: useful_four_incomplete_trust
    retained_gain: Shared proof of duplicated burden and evidence that all four can contribute without yet functioning as a household.
    next_motion: They attempt one complete circuit in which every person's limit must change the plan.
    prohibitions:
      - Do not declare the four a family or fully functioning crew.
      - Do not make the duplicated obligation an abstract conspiracy without material marks.
      - Bramble never speaks and receives no translated thoughts.
      - Do not import requirements from an earlier episode.
    source_digests:
