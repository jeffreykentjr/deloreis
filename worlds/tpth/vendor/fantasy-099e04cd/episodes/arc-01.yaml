  - ordinal: 5
    episode_id: arc1.ep05
    title: The Hound in the Thorn
    draft_mode: bounded_correction
    outline_status: accepted_design_bound
    objective: Free a trapped hound before rising water reaches the hollow.
    entry_state: Aalto is alone seeking honest binding fibre while weather closes the route home.
    required_causal_beats:
      - Aalto hears weight fighting thorn rather than a human cry.
      - Cutting the old snare tightens it; she changes method, anchors the branch, and frees Bramble without being bitten.
      - Bramble refuses rescue, food, and touch while the flood closes the return path.
      - Aalto makes shelter, treats only what Bramble permits, and sleeps without tethering the hound.
    speaking_cast: [Narrator, Aalto]
    relationship_phase: consent_begins_without_claim
    retained_gain: Bramble chooses to follow at a distance and Aalto proves she will not convert aid into ownership.
    next_motion: The storm forces Aalto and Bramble to negotiate a safe return over a second episode.
    prohibitions:
      - Bramble never speaks and receives no translated thoughts.
      - Do not turn rescue into instant loyalty, ownership, or affection.
      - Keep Enfys and Geir off mic.
      - Do not import requirements from an earlier episode.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/EPISODE-DESIGNS.md
        sha256: 8320dc7f1332ed8875fad9aa322fb9ad446ac188a2f91faecce532c4325ec8a1
