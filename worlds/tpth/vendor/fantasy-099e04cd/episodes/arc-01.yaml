episodes:
  - ordinal: 1
    episode_id: arc1.ep01
    title: The Last Dry Cord
    draft_mode: bounded_correction
    outline_status: accepted_design_bound
    early_magic:
      impossible_effect_cue: the water stood
      incapacity_cue: I cannot rise
      canon_refs: [D-0142, D-0155]
    title_card:
      music_cue_precedes: true
      required_lines:
        - To Pleach the Hedgeway.
        - By Geoffrey Hoxton.
        - Episode One.
        - The Last Dry Cord.
    objective: Keep water outside the failing low-house ward long enough to move Aalto's sick kinswoman Kaisla.
    entry_state: Aalto is alone under flood pressure, testing a correct ward knot that slips in keep-stamped false fibre.
    required_causal_beats:
      - "Ki: Aalto alone under flood pressure keeps the failing low-house ward while the sick kinswoman Kaisla waits to be moved."
      - "Sho: Aalto diagnoses the sound knot and the keep-stamped false fibre before anyone else arrives - the problem deepens with no new arrival."
      - "Ten: Enfys's entrance is the episode's twist - archive-overwhelmed, she bounds her attention with three Turning leaves and submits each premise to Aalto, and their narrow spoken proof makes floodwater stand impossibly, displaces it, and temporarily takes the use of her legs."
      - "Ketsu: Kaisla reaches a borrowed eave but dies from illness and cold; Aalto preserves the stamped cord and keeps a truthful witness."
    speaking_cast: [Narrator, Aalto, Enfys, Kaisla (Aalto's kinswoman)]
    relationship_phase: strangers_emergency_alliance
    retained_gain: A truthful witness, preserved stamped cord, a dry eave, and proof that Aalto's knot was sound.
    next_motion: Aalto and Enfys separately choose to inspect where the turned water went.
    prohibitions:
      - Do not make Aalto and Enfys friends, partners, or family.
      - Do not let Enfys arrive before Aalto diagnoses the failure.
      - Do not let Enfys enter during the sho; her arrival is the ten of the episode's kishotenketsu, never development.
      - Do not soften the impossible proof effect or its temporary loss-of-legs cost into tiredness, bleeding, or mood.
      - Do not leave the kinswoman unnamed and do not rename her; she is Kaisla (D-0229), and Kaisla and Kaisla's are the admitted forms.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/EPISODE-DESIGNS.md
        sha256: 8320dc7f1332ed8875fad9aa322fb9ad446ac188a2f91faecce532c4325ec8a1
        role: accepted_design
      - path: lab/campaign-079-unified-opening-review-head/episode-01.md
        sha256: a13d8473de0cce946dab4aa74341309d1d57ab354fb8e23472806aded5d8cd0a
        role: bounded_polish_source
  - ordinal: 2
    episode_id: arc1.ep02
    title: Name Before Measure
    draft_mode: bounded_correction
    outline_status: accepted_design_bound
    early_magic:
      impossible_effect_cue: the water in the low room lay flat and refused the channel
      incapacity_cue: not_applicable
      canon_refs: [D-0142, D-0155]
    title_card:
      music_cue_precedes: true
      required_lines:
        - To Pleach the Hedgeway.
        - By Geoffrey Hoxton.
        - Episode Two.
        - Name Before Measure.
    objective: Drain a low room before returning rain takes it.
    entry_state: Only hours after meeting, Aalto and Enfys have one preserved cord, one dry eave, and no durable agreement.
    required_causal_beats:
      - They trace moving and standing water and disagree about whether water needs an argument or merely a hole.
      - Aalto opens one blocked runnel while Enfys holds standing and moving water apart in a narrow proof.
      - Aalto challenges the false separation; Enfys speaks the bounded conclusion and the room water tips impossibly into the runnel.
      - A one-finger fall, dry corner, readable drip, shared broth, and limited three-threshold agreement remain.
    speaking_cast: [Narrator, Aalto, Enfys]
    relationship_phase: functional_truce
    retained_gain: Usable shelter, a readable drip-clock, and a three-threshold agreement with duties, duration, and separate exits.
    next_motion: The drip-clock forces a check of the higher rooms.
    prohibitions:
      - Do not turn the functional truce into friendship, partnership, or family.
      - Do not remove either girl's credible option to leave.
      - Keep Bramble and Geir out.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/EPISODE-DESIGNS.md
        sha256: 8320dc7f1332ed8875fad9aa322fb9ad446ac188a2f91faecce532c4325ec8a1
        role: accepted_design
