        role: bounded_polish_source
  - ordinal: 6
    episode_id: arc1.ep06
    title: The Distance Chosen
    draft_mode: bounded_correction
    outline_status: accepted_design_bound
    objective: Reach the high room with Bramble without forcing the hound across unsafe ground.
    entry_state: Aalto and Bramble are weather-bound; Bramble remains present but beyond touch.
    required_causal_beats:
      - Shared food and route choices establish consent by repeated action.
      - Bramble refuses the official raised path.
      - Testing reveals seep and unstable fill, so Aalto abandons the quickest route.
      - They return safely; Bramble chooses the threshold and later accepts an offered, unfastened Frith-knot collar.
    speaking_cast: [Narrator, Aalto, Enfys]
    relationship_phase: chosen_animal_bond
    retained_gain: Bramble chooses the threshold and collar; a safer route contradicts the official path.
    next_motion: Bramble's refused route supplies the next concrete ground question.
    prohibitions:
      - Bramble never speaks and receives no translated thoughts.
      - Enfys must not interpret Bramble for Aalto.
      - Keep Geir out.
      - Do not import requirements from an earlier episode.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/EPISODE-DESIGNS.md
