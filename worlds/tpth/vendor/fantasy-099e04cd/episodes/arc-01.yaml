  - ordinal: 8
    episode_id: arc1.ep08
    title: The Hidden Finish
    draft_mode: new_outline_then_draft
    outline_status: new_typed_outline_required
    objective: Follow the outward repair while pacing Enfys's capacity and identify the craft without inventing its maker.
    entry_state: The trio has a rerouted workday and a hidden repair pointing beyond the refused ground.
    required_causal_beats:
      - Enfys overreaches on the outward path.
      - Aalto and Bramble change the pace rather than rewarding her overreach.
      - They find a repair whose finish Enfys recognizes through material craft.
      - The work foreshadows Geir before any explanation or meeting.
    speaking_cast: [Narrator, Aalto, Enfys]
    relationship_phase: paced_three_member_investigation
    retained_gain: A recognized craft signature and a working practice in which limits change the pace.
    next_motion: The crew follows the repair to its living maker.
    prohibitions:
      - Keep Geir off mic and unnamed unless admitted naming provenance supplies him.
      - Do not frame Enfys's overreach as heroism.
      - Bramble never speaks and receives no translated thoughts.
      - Do not import requirements from an earlier episode.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/ARC-01.md
        sha256: c34b59be9bf47cb58362126a6c1dc8589bc682f0dc39458d8ead4cec65e69444
        role: accepted_causal_map
  - ordinal: 9
    episode_id: arc1.ep09
    title: The Old Repairer
    draft_mode: new_outline_then_draft
    outline_status: new_typed_outline_required
    objective: Meet Geir through the necessary repair and make his specific cold history with Enfys audible without forcing trust.
    entry_state: The trio has traced a recognized repair finish to its maker after learning to pace Enfys's limits.
    required_causal_beats:
      - The crew meets Geir through work rather than exposition.
      - His history with Enfys is audible, cold, and specific.
      - Geir refuses a rescue posture.
      - He completes one necessary brace while trust remains incomplete.
    speaking_cast: [Narrator, Aalto, Enfys, Geir]
    relationship_phase: geir_cold_entry
    retained_gain: One completed brace and a fourth person whose usefulness does not erase mistrust.
    next_motion: The four must compare materially marked obligations while old history disrupts their timing.
    prohibitions:
      - Do not make Geir a rescuer, instant mentor, or family elder.
      - Do not resolve Geir and Enfys's history on arrival.
      - Do not repeat Bramble's bond as a new-character handoff.
      - Do not import requirements from an earlier episode.
    source_digests:
