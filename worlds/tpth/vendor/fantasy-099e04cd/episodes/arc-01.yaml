        role: bounded_polish_source
  - ordinal: 3
    episode_id: arc1.ep03
    title: The Sealed Way
    draft_mode: bounded_correction
    outline_status: accepted_design_bound
    early_magic:
      impossible_effect_cue: the tread has taken your weight and its own again
      incapacity_cue: not_applicable
      canon_refs: [D-0142, D-0155]
    title_card:
      music_cue_precedes: true
      required_lines:
        - To Pleach the Hedgeway.
        - By Geoffrey Hoxton.
        - Episode Three.
        - The Sealed Way.
    objective: Complete the negotiated three-threshold round before dark and make one reciprocal shelter usable.
    entry_state: Aalto and Enfys have a functional truce, a drip-clock, and an unfinished route through three thresholds.
    required_causal_beats:
      - Re-establish the slope, three doors, runnel, crest, lane, and unused upper room before work begins.
      - Local hands, Aalto, and Enfys clear the lower runnel, share one cord's load, and repair the stile tread.
      - Aalto rejects Enfys's first claim; their corrected bounded proof seats the plank impossibly into an uncut wall joint.
      - A dry upper room, reciprocal shelter terms, divided meal, repeatable round, and keep-stamped box remain.
    speaking_cast: [Narrator, Aalto, Enfys]
    relationship_phase: earned_respect_not_family
    retained_gain: A stable upper room, reciprocal shelter, a repeatable three-door round, and a marked wooden box.
    next_motion: The keep-stamped box opens a material inquiry into approved measures.
    prohibitions:
      - Do not make earned respect into friendship, partnership, family, or a promise of shared future.
      - Keep Bramble and Geir out.
      - Do not let sound design carry the load-path reasoning.
    source_digests:
