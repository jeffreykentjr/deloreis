  - ordinal: 7
    episode_id: arc1.ep07
    title: Where Bramble Will Not Walk
    draft_mode: new_outline_then_draft
    outline_status: new_typed_outline_required
    objective: Test the ground Bramble refused and reroute one day's necessary work.
    entry_state: Aalto, Enfys, and Bramble have a safer-return observation that contradicts the official raised path.
    required_causal_beats:
      - The three test the refused ground without treating Bramble as a mystic instrument.
      - Material evidence makes Bramble's bodily refusal admissible witness.
      - The day's work is rerouted rather than forcing the official path.
      - A hidden repair points the inquiry outward.
    speaking_cast: [Narrator, Aalto, Enfys]
    relationship_phase: three_member_working_group
    retained_gain: A safer reroute and a practice of admitting bodily refusal as evidence.
    next_motion: The hidden repair's finish must be inspected beyond the immediate route.
    prohibitions:
      - Bramble never speaks and receives no translated thoughts.
      - Do not turn animal perception into prophecy or supernatural certainty.
      - Keep Geir off mic; only material work may foreshadow him.
      - Do not import requirements from an earlier episode.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/ARC-01.md
        sha256: c34b59be9bf47cb58362126a6c1dc8589bc682f0dc39458d8ead4cec65e69444
