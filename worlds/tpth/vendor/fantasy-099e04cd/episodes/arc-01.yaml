  - ordinal: 4
    episode_id: arc1.ep04
    title: The Weather They Left Out
    draft_mode: bounded_correction
    outline_status: accepted_design_bound
    objective: Compare the found stamped deck with Enfys's worn Turning without claiming the found object.
    entry_state: Aalto and Enfys have earned respect, a usable room, and a keep-stamped box whose contents remain unclaimed.
    required_causal_beats:
      - Count food and capacity before inquiry.
      - Enfys demonstrates that the Turning holds observations outside the mind and does not predict.
      - Aalto counts both decks and finds that the approved deck physically omits hard Weathers.
      - Both decks remain open and countable; missing honest binding fibre sends Aalto out alone.
    speaking_cast: [Narrator, Aalto, Enfys]
    relationship_phase: bounded_working_pair
    retained_gain: A public, countable omission and two preserved decks that can be shown to later witnesses.
    next_motion: Aalto goes alone to find honest binding fibre.
    prohibitions:
      - Do not make the Turning prophetic or mystical.
      - Do not let either girl claim the found deck.
      - Keep Bramble and Geir out.
    source_digests:
      - path: lab/campaign-079-unified-opening-review-head/EPISODE-DESIGNS.md
