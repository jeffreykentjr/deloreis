# Deterministic fantasy/sci-fi franchise collision lists (D-0101).
#
# "the naming oracle should just have deterministic checking of lists of key fantasy
# property names ... GoT and LoTR and such have to be checked for fucking everything."
#
# Matching (all offline, O(1) set lookups + one normal form — casefold, strip
# diacritics/spaces/hyphens/apostrophes):
#   - `franchises`: iconic named entities. Matched as a normalized WHOLE NAME or per
#     TOKEN (never as a bare substring), and only tokens >= 4 letters, so common words
#     (Snow, Tear, Bane, Dale) do not false-positive. An exact/token hit FAILS at every
#     tier and kind. Deliberately curated to DROP names that are genuine real-world
#     words or pre-existing mythology GRRM/Tolkien borrowed (Bran, Rob, Jon, Ghost,
#     Snow, Dale, Reach, Vale) — those are handled by the role-aware pop-collision check.
#   - `morphemes`: coined word-parts so franchise-distinctive they collide even inside a
#     compound (borg → "Steinborg"). Matched as SUBSTRINGS; FAIL at every tier.
#   - `place_qualifiers`: franchise-charged qualifiers that collide in a PLACE compound
#     (iron → "Irondale" vs GoT's Iron Islands / Ironborn). FAIL for places and at
#     core-cast tier; WARN below. Bare topographic generics (-dale, -by, -combe) never
#     trip on their own.

