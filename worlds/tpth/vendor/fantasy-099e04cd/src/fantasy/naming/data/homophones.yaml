# Homophone / near-homophone traps (D-0101 follow-up; audio-first).
#
# This is an AUDIO-drama: a name that SOUNDS like a common or unfortunate word confuses
# or amuses a listener even when it reads fine. Matched by exact spelling, vowel-collapsed
# normal form, and one-edit distance. A hit is a WARN — advisory, not a veto.
#
# Two groups, because the snicker test is tuned for BEINGS, not titles (title-round-2):
#   - `traps`   universal audio-confusables — checked for EVERY kind (a title candidate
#               like "The Souring" must still flag Scouring).
#   - `snicker` bodily / castration / insult words — the red-team "snicker test", checked
#               only for PERSON names (and a bare being-name of unknown kind). Relaxed for
#               concept / organization / place / title kinds, so "The Mended Ground"
#               (concept) does not trip the gelding trap while "geld" (person) still does.
#
# Curated to stay tasteful and low-false-positive; extend as drafting surfaces new ones.

traps:
  # Near-homophones flagged by the title research
  - {word: scouring, note: "'Souring' ~ 'Scouring' — an abrasive-cleaning echo (title research §8)."}
  - {word: doomsday, note: "apocalypse echo."}
  - {word: domesday, note: "'Domesday' is pronounced 'Doomsday' (the Domesday Book) — apocalypse echo."}
  # Audio-ambiguous by ear (D-0108: Wynne is unclear heard aloud)
  - {word: wynn, note: "Wynne/Wyn-class is heard as 'win' / 'when' / 'whin' — audio-ambiguous."}
  - {word: win, note: "reads as the verb 'win'."}
  - {word: when, note: "function-word echo."}

snicker:
  # The castration cluster — the "geld" snicker test (person/being names only)
  - {word: geld, note: "'geld' IS the English verb 'to castrate'; unfortunate for an animal/hound name."}
  - {word: gelding, note: "a gelded (castrated) animal — snicker test for beast names."}
  - {word: castrate, note: "castration echo."}
  # Bodily / clinical words a person-name should not sound like
  - {word: colon, note: "punctuation / bowel snicker."}
  - {word: rectum, note: "anatomical snicker."}
  - {word: bowel, note: "anatomical snicker."}
  - {word: urine, note: "e.g. Welsh 'Urien' reads/sounds like 'urine' — a real red-team catch."}
  - {word: phlegm, note: "clinical/unpleasant echo."}
  - {word: mucus, note: "clinical/unpleasant echo."}
  - {word: pustule, note: "clinical/unpleasant echo."}
  - {word: groin, note: "anatomical snicker."}
  - {word: gonad, note: "anatomical snicker."}
  - {word: scrotum, note: "anatomical snicker."}
  # Death/decay register a hero-name should usually avoid sounding like
  - {word: carrion, note: "rotting-flesh echo."}
  - {word: offal, note: "'awful'/entrails echo."}
  - {word: manure, note: "dung echo."}
  # Insult / mundane collisions that flatten a person-name by ear
  - {word: moron, note: "insult echo."}
  - {word: sewer, note: "waste echo."}
