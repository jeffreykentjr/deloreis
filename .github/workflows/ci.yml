name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Debug info dominates `target/` size and the linker's peak memory. The gate
# compiles the workspace several times over (the default and syntax lanes, each
# under both the clippy and the rustc driver), so the accumulated debug artifacts
# overrun the runner's disk (`No space left on device`) and OOM the final link
# (`ld ... signal 7`). None of the gate's checks — build, clippy, tests, docs —
# depend on debug symbols, so CI builds omit them. Incremental compilation only
# bloats `target/` on an otherwise-cold runner, so it is off too. This trims the
# build's output rather than papering over it with a `cargo clean` between steps.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep each job's workspace cache separate. The old shared key let
          # whichever parallel job saved first prevent the canonical gate's
          # workspace artifacts from being stored at all.
          shared-key: gate-v2-${{ github.job }}
          # Preserve local crate outputs as well as registry dependencies. Cargo
          # fingerprints remain the invalidation authority when source changes.
          cache-workspace-crates: true
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-deny
      - run: python3 scripts/test-publish-crates.py
      - run: python3 scripts/test-release-controls.py
      - run: cargo run -p xtask --locked -- gate --ci --receipt out/greengate/ci

  docs-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-v2-${{ github.job }}
          cache-workspace-crates: true
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: cargo run -p xtask --locked -- docs-oracle
      - run: cargo run -p xtask --locked -- book
      - name: Save the book preview
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ github.sha }}
          path: out/book
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  no-ai-authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          scripts/no-ai-authorship.sh
          "${{ github.event_name }}"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          "${{ github.event.before }}"
          "${{ github.sha }}"
