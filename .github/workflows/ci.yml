name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Debug info dominates `target/` size and the linker's peak memory. The gate
# compiles the workspace several times over (the default and syntax lanes, each
# under both the clippy and the rustc driver), so the accumulated debug artifacts
# overrun the runner's disk (`No space left on device`) and OOM the final link
# (`ld ... signal 7`). None of the gate's checks — build, clippy, tests, docs —
# depend on debug symbols, so CI builds omit them. Incremental compilation only
# bloats `target/` on an otherwise-cold runner, so it is off too. This trims the
# build's output rather than papering over it with a `cargo clean` between steps.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-deny
      - run: cargo run -p xtask --locked -- gate --ci --receipt out/greengate/ci

  # The LS-7 default-build oracle, standing alone. It is already inside the
  # canonical gate (these are gate steps, verbatim); running it as its own job
  # means "the shipped artifacts still link no parser" reads off the checks list
  # without decoding a gate log.
  default-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo build -p dli-serve -p deloreis --locked
      - run: cargo run -p xtask --locked -- syntax-free
      - run: >-
          cargo nextest run -p dli-serve -p dli-lorestore
          --lib --test default_build
          --test store_backed_project --test span_identity
          --locked --profile ci

  docs-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: cargo run -p xtask --locked -- docs-oracle
      - run: cargo run -p xtask --locked -- book

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  no-ai-authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          scripts/no-ai-authorship.sh
          "${{ github.event_name }}"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          "${{ github.event.before }}"
          "${{ github.sha }}"
