name: Build Linux release archive

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release or RC tag
        required: true
        type: string
      commit:
        description: Full commit SHA for the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-linux-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: x86_64-unknown-linux-gnu
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, build and package
        run: bash scripts/build-release-archive.sh
      - name: Attest archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attach to the draft
        run: |
          python3 scripts/release-control.py
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
