name: Publish the book

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: cargo run -p xtask --locked -- book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/book
      - id: deploy
        uses: actions/deploy-pages@v4
