# saltmarket-episodes — three episodes over the saltmarket world, as PAYLOAD DATA.
#
# Episodes are serde data payloads until their .dli surface form arrives with
# TIME-3 (the EPI-1 boundary ruling; DraftPayload precedent). This file is a
# serialization of `dli_world::episode` types — a top-level `Vec<Episode>`, the
# input `fold(&[Episode])` consumes (crates/dli-world/src/episode.rs). It
# deserializes cleanly with serde_yaml_ng (the workspace's YAML crate); the
# externally-tagged enums use YAML tags: presence `!OnMic`/`!OffMic`, and a cast
# knower `!Cast <name>` (the listener knower is the plain unit variant `Listener`).
#
# Two times, bound separately (03-time): `production_order` is the listener's
# dimension; `story_anchor` is the world's. A scene may carry its own
# `scene_anchor` to cross into story-time — a flashback — so its facts land at the
# earlier story-time while its reveals (listener knowledge_deltas) land at the
# episode's production slot. Tide cycle: tide(4) = ebb(0) | slack(1) | flood(2) |
# high(3); an anchor phase is a single position per cycle, not a walk.

- id: e01                       # "The First Weir"
  production_order: 1
  story_anchor:
    era: first-tides
    after: [the-first-weir]
    before: []
    phases:
      - { cycle: tide, index: 0 }   # ebb
  scenes:
    - id: s1
      cast: [old-fen]
      presence:
        - !OnMic old-fen
      location: the-weir
      scene_anchor: null
      knowledge_deltas:
        - knower: Listener            # the listener learns (a reveal)
          fact: the-first-weir-raised
        - knower: !Cast old-fen
          fact: old-fen-tends-the-weir
      fact_deltas:
        - { fact: the-first-weir-raised, provenance: null }
      opens: [who-keeps-the-ledger]   # an open loop, resolved in e03
      closes: []

- id: e02                       # "The Drought Years"
  production_order: 2
  story_anchor:
    era: the-drought-years
    after: [the-long-drought]
    before: []
    phases:
      - { cycle: tide, index: 1 }   # slack
  scenes:
    - id: s1
      cast: [mara, old-fen]
      presence:
        - !OnMic mara
        - !OffMic old-fen
      location: the-weir
      scene_anchor: null
      knowledge_deltas:
        - knower: Listener
          fact: the-weir-enclosed
        - knower: !Cast mara          # mara learns of the enclosure
          fact: the-weir-enclosed
      fact_deltas:
        - { fact: the-weir-enclosed, provenance: null }
      opens: []
      closes: []

- id: e03                       # "The Salt-Ledger"
  production_order: 3
  story_anchor:
    era: the-ledger-days
    after: [the-ledger-struck]
    before: []
    phases: []
  scenes:
    - id: s1
      cast: [old-fen]
      presence:
        - !OnMic old-fen
      location: saltmarket
      scene_anchor: null
      knowledge_deltas:
        - knower: Listener
          fact: old-fen-keeps-the-salt-ledger
      fact_deltas:
        - { fact: old-fen-keeps-the-salt-ledger, provenance: null }
      opens: []
      closes: [who-keeps-the-ledger]   # the loop opened in e01 closes here
    - id: s2                    # a flashback scene: its own earlier anchor
      cast: [mara]
      presence:
        - !OnMic mara
      location: the-weir
      scene_anchor:
        era: the-drought-years
        after: [the-long-drought]
        before: [the-marsh-enclosure]   # before the enclosure: the water was still common
        phases:
          - { cycle: tide, index: 2 }   # flood
      knowledge_deltas:
        - knower: Listener              # reveal lands at production slot 3...
          fact: the-weir-common
        - knower: !Cast mara
          fact: the-weir-common
      fact_deltas:
        - { fact: the-weir-common, provenance: null }   # ...but the fact is placed at the-drought-years
      opens: []
      closes: []
