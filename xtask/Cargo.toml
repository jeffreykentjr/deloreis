[package]
name = "xtask"
description = "Deloreis Lore Interchange build automation: gate, schema, fixtures, oracles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# `docgen` renders the CLI reference from `deloreis::command()`, and the
# committed reference documents the *whole* toolchain — including the `.dli`
# subcommands LS-7 put behind `deloreis/syntax`. So the docgen step (and the
# workspace's syntax lane) builds xtask with this on; the LS-7 default-build
# oracle in `syntax_free` never runs xtask against the crates it inspects, so
# nothing here can mask it.
syntax = ["deloreis/syntax", "dli-serve/syntax", "dli-world/syntax", "dli-lorestore/syntax"]

[dependencies]
dli-ast.workspace = true
dli-lorestore.workspace = true
dli-world.workspace = true
dli-serve.workspace = true
deloreis.workspace = true
clap.workspace = true
# dli-syntax is required by the docs-oracle (`dli_syntax::probe_source`); the
# build spec's dependency list omitted it.
dli-syntax.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde_saphyr.workspace = true
jsonschema.workspace = true
sha2.workspace = true
walkdir.workspace = true

[dev-dependencies]
syn.workspace = true
proc-macro2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
