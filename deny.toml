[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution): required by borrow-or-share, a transitive dep
    # of the mandated jsonschema crate (jsonschema -> referencing -> fluent-uri).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
