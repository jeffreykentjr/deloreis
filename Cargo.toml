[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jeffreyksmithjr/deloreis"
rust-version = "1.96"
publish = false

[workspace.dependencies]
# Internal path deps (library crates).
dli-ast = { path = "crates/dli-ast" }
dli-core = { path = "crates/dli-core" }
dli-syntax = { path = "crates/dli-syntax" }
dli-sim = { path = "crates/dli-sim" }
dli-time = { path = "crates/dli-time" }
dli-eval = { path = "crates/dli-eval" }
dli-ledger = { path = "crates/dli-ledger" }
dli-world = { path = "crates/dli-world" }
dli-export = { path = "crates/dli-export" }
dli-game = { path = "crates/dli-game" }
dli-serve = { path = "crates/dli-serve" }
deloreis = { path = "crates/deloreis" }

# External deps.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
miette = "7"
clap = { version = "4", features = ["derive"] }
proptest = "1"
insta = { version = "1", features = ["json"] }
anyhow = "1"
serde_yaml_ng = "0.10"
jsonschema = "0.30"
sha2 = "0.10"
walkdir = "2"
fs2 = "0.4"
serde_json_canonicalizer = "0.3"
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
