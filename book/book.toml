[book]
title = "De Lore Is"
authors = ["De Lore Is contributors"]
description = "A guide to checking continuity in fictional worlds."
language = "en"
src = "src"

[output.html]
default-theme = "rust"
git-repository-url = "https://github.com/jeffreykentjr/deloreis"

[preprocessor.strip-frontmatter]
command = "python3 ../scripts/mdbook-strip-frontmatter.py"
after = ["links"]
