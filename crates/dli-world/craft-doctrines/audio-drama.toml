# audio-drama doctrine pack (Phase-3 craft separation, Step 4).
# Shipped generic craft principles: world-agnostic by construction,
# authored from the KB classification. Real published frameworks only.
pack = "audio-drama"

[[principles]]
id = "sfx-as-character"
family = "audio"
statement = "Sound effects are atmosphere and orientation, not a hidden visual channel. Script the sonic reality so the mix carries place, pressure, and punctuation, but do not ask it to teach subtle object mechanics the ear cannot decode."
source = "Wayland, Bombs Always Beep (theatre for the mind)."
phases = ["generation"]
checkable_kind = "none"

[[principles]]
id = "audio-show-dont-tell"
family = "audio"
statement = "Let sound carry obvious heard facts: the door opens, rain hits shutters, footsteps cross a room. Do not make sound the primary carrier of subtle mechanics or causal information; the narrator or dialogue must state what changed and why it matters."
source = "Gill (SFWA, listeners fill the gap); Wayland; Urbina (Wolf 359)."
phases = ["generation", "revision"]
checkable_kind = "judge"

[[principles]]
id = "narrated-sound-to-sfx"
family = "audio"
statement = "If the narrator describes an event whose whole point is that it is heard, a latch, rain, wind, footsteps, breath, move it into the sound design unless the line is carrying causality or object meaning that sound alone cannot convey."
source = "Wayland; Gill (SFWA): narrated sound belongs in the mix."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "sfx-cannot-carry-mechanics"
family = "audio"
statement = "Abstract state, a mechanism working or failing, text, recognition, private knowledge, emotional interpretation, is not legible as sound. A cue can add rasp, rain, or breath, but the narrator or dialogue must plainly carry the state change: what moved, what failed, what proved false, what was discovered, and why it matters. Over-detailed or impossible sound prompts are hard failures in audio scripts."
source = "Gill (SFWA); audio-drama SFX legibility craft."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "sixty-second-hook"
family = "audio"
statement = "Earn attention inside the first minute: the smallest moment of boredom or confusion can lose an audio listener, who has less to hold them than a screen does. The opening image must grip before the frame explains itself."
source = "Urbina, Advice for Radio Drama Beginners; Wayland (the hook)."
phases = ["outline", "generation"]
checkable_kind = "deterministic-kernel"
kernel_rule = "check-outline"

[[principles]]
id = "three-four-voices-per-scene"
family = "audio"
statement = "Keep a scene to three or four speaking voices. Past that the ear loses track of who is who, especially when two performers sit near the same pitch. Split a crowded scene or let some characters stay silent presences."
source = "Toscan, Writing Audio Drama; Gill (SFWA, cast-size confusion); Urbina (the four-hander)."
phases = ["outline", "generation"]
checkable_kind = "deterministic-prose"
default_params = { cast_per_scene = 4 }

[[principles]]
id = "vocal-signature-per-character"
family = "audio"
statement = "Every character needs a distinct vocal signature, vocabulary, cadence, register, so a listener can tell them apart before a name is spoken. Homogenized voices are the top narrative tell and the central risk of any voiced ensemble."
source = "Toscan; Wayland; Kowal (puppetry-derived voice work)."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "strategic-name-pepper"
family = "audio"
statement = "Salt the dialogue with names so the listener always knows who is in the room and who is speaking. Too little breeds who-is-talking confusion; too much reads as unnatural. Address by name at entrances, turns, and after any ambiguity."
source = "Toscan, Writing Audio Drama (signposting); radio-drama convention."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "scripted-silence"
family = "audio"
statement = "Silence is a scored instrument: a held beat, wind and fire-crackle, footsteps in mud. The courage to hold silence instead of wall-to-wall scoring is a signature of the register, and a pause held a beat long carries more than a line."
source = "Werner; audio-design silence craft (the courage to hold silence)."
phases = ["generation"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "performance-direction-markers"
family = "audio"
statement = "Human-review scripts may stay readable, but dialogue-heavy drafts should include sparse bracketed performance direction where it matters, for example a [tired] marker before a line, so the artifact is already production-aware."
source = "Hybrid-format practice; audio-drama scripting convention."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "first-meeting-audibility"
family = "audio"
statement = "When two core characters meet for the first time, the listener must hear and keep hearing that relationship state. A lexical stranger cue does not excuse established-pair habits, assumed shared plans, or instant-family behavior later in the episode."
source = "Toscan (signposting); relationship-legibility craft."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "dialogue-scenes-have-turns"
family = "audio"
statement = "Good drama dialogue is motivated action: a line asks, resists, reframes, withholds, or changes the power in the room. Long exchanges need questions, contrast, reversals, grounding beats, and subtext with enough surface clarity to keep pace."
source = "McKee, Story (scene turns); Mamet (practical dialogue)."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "audio-opening-pressure"
family = "audio"
statement = "A patient four-act structure is fine, but the first story minute still needs an audio hook: a concrete pressure already happening, then enough narration to understand it. Do not open with a room inventory or muttered procedure before the listener knows what can be lost."
source = "Sanderson (promises in the opening); audio-first clarity doctrine."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "specific-family-context"
family = "audio"
statement = "If family danger motivates the scene, make the family context incidentally specific. The viewpoint character knows who is in the bed, so the listener should hear a name or relation early; vague labels like 'the sick kinsman' turn human stakes into fog."
source = "Sanderson (sympathy through concrete stakes); Toscan (signposting)."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "lone-opening-dialogue-context"
family = "audio"
statement = "Do not make a lone character carry the opening by talking to herself. If she is alone, narration must ground what the listener cannot see; if another person is present, let that person become an audible anchor when useful."
source = "Urbina; audio-drama listener-orientation practice."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "performable-voice-strangeness"
family = "audio"
statement = "A character may sound strange, but the script cannot depend on unproducible voice layering. Let the performer simply speak the line; put the otherness in word choice, behaviour, cost, and reactions, not in directions for multiple hidden voices or impossible acoustic variation."
source = "Voice-performance practice (TTS and actor constraints)."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "no-as-you-know-bob"
family = "audio"
statement = "No character tells another something both already know for the audience's benefit (the maid-and-butler / as-you-know-Bob leak). It is the loudest exposition tell and it shatters the sincerity the register depends on."
source = "Wayland; Toscan; classic BBC radio-drama guidance (maid-and-butler)."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"

[[principles]]
id = "hybrid-script-formatting"
family = "audio"
statement = "Use a script format that carries sound as first-class: speaker cues, sound cues, and beats legible to a director and a foley artist. Format serves the production process and the listener, nothing else."
source = "Wayland, Bombs Always Beep (hybrid format)."
phases = ["generation"]
checkable_kind = "none"

[[principles]]
id = "clarity-is-life-or-death"
family = "audio"
statement = "In audio, clarity is survival: give the audience exactly enough to fill the gaps the way you intend. A plot beat that depends on the listener seeing something will not land, so route every load-bearing turn through sound and speech."
source = "Urbina, Advice for Radio Drama Beginners; Gill (SFWA)."
phases = ["generation", "revision"]
checkable_kind = "none"

[[principles]]
id = "plot-points-per-episode"
family = "audio"
statement = "A useful density heuristic: roughly ten plot points per episode, where a plot point is any item you would list when recapping the installment. It is a texture gauge, not a rule, a way to feel whether an episode is thin or overstuffed."
source = "Urbina, Wolf 359 (ten plot points per episode)."
phases = ["outline"]
checkable_kind = "none"

[[principles]]
id = "aphorism-as-acoustic-logo"
family = "audio"
statement = "Because the show is heard, belief systems cannot lean on a visible symbol; a creed's repeated aphorism, in a fixed cadence over a signature texture, is its acoustic logo. Give each faction a phrase the listener knows before a name is said."
source = "Wagnerian leitmotif (recurring musical/verbal signatures); acoustic-identity craft."
phases = ["lore-decision", "generation"]
checkable_kind = "none"

[[principles]]
id = "music-as-learned-lexicon"
family = "audio"
statement = "Music works two ways: fixed signatures that punctuate the open and close, and a recognizable mood lexicon the listener learns, a motif tied to a faction, a mood, or a place. Consistency turns the score into orientation."
source = "Audio-branding literature (sonic logos and learned motifs); Wagnerian leitmotif."
phases = ["generation"]
checkable_kind = "none"

[[principles]]
id = "final-musical-sting"
family = "audio"
statement = "A full episode script should mark its closing musical sting or coda explicitly. The final cue is part of the episode shape, not an afterthought for production to infer from prose."
source = "Audio-drama scripting convention (mark the closing cue)."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"
