# mice-quotient doctrine pack (Phase-3 craft separation, Step 4).
# Shipped generic craft principles: world-agnostic by construction,
# authored from the KB classification. Real published frameworks only.
pack = "mice-quotient"

[[principles]]
id = "mice-quotient"
family = "plot"
statement = "Every thread is one of four kinds: Milieu (a place entered and left), Inquiry (a question asked and answered), Character (an identity strained and resettled), or Event (an order disrupted and restored). Name each thread's kind so you know what it owes."
source = "Card, How to Write SF&F (1990); Kowal, MICE Quotient."
phases = ["outline"]
checkable_kind = "deterministic-kernel"
kernel_rule = "check-outline"
finding_codes = ["outline.mice-beat-unknown"]

[[principles]]
id = "mice-lifo-nesting"
family = "plot"
statement = "Threads nest like code: the first opened is the last closed (LIFO). A thread opened inside another must close before its parent, or the structure reads as a dropped stitch and the ending feels wrong without the reader knowing why."
source = "Kowal, MICE Quotient nesting codes (HTML-tag analogy)."
phases = ["outline", "revision"]
checkable_kind = "deterministic-kernel"
kernel_rule = "check-outline"
finding_codes = [
    "outline.mice-closes-before-open",
    "outline.mice-interleaved",
]

[[principles]]
id = "mice-milieu-as-hub"
family = "plot"
statement = "A Milieu thread opens on entering a place and closes on leaving it. The hub-and-spoke structure is a chain of Milieu threads: the party arrives, works the region, and migrates on."
source = "Card/Kowal, MICE Quotient (Milieu thread)."
phases = ["outline"]
checkable_kind = "deterministic-kernel"
kernel_rule = "check-outline"

[[principles]]
id = "mice-event-new-equilibrium"
family = "plot"
statement = "An Event thread opens when an order is disrupted and closes when order returns. The satisfaction is the world knitted back together."
source = "Card/Kowal, MICE Quotient (Event thread)."
phases = ["outline"]
checkable_kind = "none"
