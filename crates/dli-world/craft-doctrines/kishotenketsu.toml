# kishotenketsu doctrine pack (Phase-3 craft separation, Step 4).
# Shipped generic craft principles: world-agnostic by construction,
# authored from the KB classification. Real published frameworks only.
pack = "kishotenketsu"

[[principles]]
id = "kishotenketsu-ten-is-the-turn"
family = "plot"
statement = "In ki-sho-ten-ketsu the third act (ten) is the crux: a turn that recontextualizes the first two acts so the listener re-reads everything just heard. The turn need not be a conflict; it is a shift in what the material means."
source = "Kishotenketsu (classical East Asian four-act structure)."
phases = ["outline", "generation"]
checkable_kind = "none"

[[principles]]
id = "climax-is-perspective-shift"
family = "plot"
statement = "The high point of an arc is the moment the trouble is revealed to be other than it seemed, its cause shown to be human and systemic. The resolution is a recognition that reframes the whole, not a blow that wins it."
source = "Kishotenketsu (the ten as reframe); Truby, The Anatomy of Story (revelation)."
phases = ["outline", "generation", "revision"]
checkable_kind = "judge"

[[principles]]
id = "four-beat-labels-earn-their-turns"
family = "audio"
statement = "Structural beat labels are not structure by themselves. The complication beat must be the actual complication the listener hears, and the turn must be the actual recontextualization; do not label a later weak beat as the turn when the scene has already moved."
source = "Kishotenketsu (ten-is-the-turn); structural-integrity craft."
phases = ["generation", "revision"]
checkable_kind = "deterministic-prose"
