# Seeded-divergence operators for the native repository validator (V1–V12, no V9).
#
# Each operator copies `baseline/` (which validates clean), applies ONE seeded
# change, and names every finding the validator must then produce — path, line,
# code, and a distinguishing fragment of the message.
# `crates/dli-world/tests/repository_detection.rs` walks this file;
# `docs/design-notes/native-repository-validator.md` is the written-up mapping.
# This file is DATA only.
#
# seeded_change kinds:
#   write   — create or overwrite `path` with `content`
#   replace — substitute `from` with `to` inside `path`; `from` must occur exactly once
#   append  — append `content` to the end of `path`
#
# `code` names the V-slice the operator exists to prove. `expected` is the whole
# finding set, including collateral the seed legitimately causes; an operator
# whose expected set is larger than one row is documenting a real interlock
# between checks, not a sloppy seed.
#
# `message_contains` is not decoration. Two different defects in the same file
# can land on the same (path, line, code) triple — a malformed YAML append and a
# duplicate registry id both read `data/characters.yaml:1 V6` — so a corpus that
# pinned only the triple would bless the wrong catch. It did, once, while this
# corpus was being written; the message fragment is the repair.
#
# Line semantics differ per check and are pinned here as they are, not as they
# ought to be. V6 and V7 findings carry line 1 because the YAML reader keeps no
# position — a file-level convention the design note records as an accepted
# deviation. V8 reports the file-absolute line (DL-0060 fixed the former
# body-relative numbering); every check now names a real file line.

operators:
  - operator: v1-missing-frontmatter
    code: V1
    description: An authority file filed with no frontmatter block at all.
    seeded_change:
      kind: write
      path: concepts/orphan-note.md
      content: |
        A note filed straight into the tree with no frontmatter block.

        Nothing here is authority, and the validator has no way to know what it is.
    expected:
      - path: concepts/orphan-note.md
        line: 1
        code: V1
        message_contains: missing frontmatter block
    rationale: >-
      The first gate. Without a frontmatter block the file has no id, type, or
      standing, so `check_frontmatter` reports and returns before V2 or V3 can
      run — the finding set is deliberately one row.

  - operator: v1-unparsable-frontmatter
    code: V1
    description: A frontmatter block that is present, terminated, and not YAML.
    seeded_change:
      kind: write
      path: concepts/broken-yaml.md
      content: |
        ---
        id: broken-yaml
        title: [unterminated
        type: concept
        status: proposed
        ---

        ## Body

        > status: proposed

        The frontmatter above is well-delimited but does not parse.
    expected:
      - path: concepts/broken-yaml.md
        line: 1
        code: V1
        message_contains: "frontmatter:"
    rationale: >-
      Distinguishes "no frontmatter" from "frontmatter that lies". The parse
      failure is V1, not V2: V2 judges a schema, and there is no document to
      judge. The id index falls back to the filename stem, so nothing downstream
      trips.

  - operator: v2-invalid-type-enum
    code: V2
    description: A frontmatter `type` outside the closed vocabulary.
    seeded_change:
      kind: replace
      path: places/the-slow-ferry.md
      from: "type: place"
      to: "type: hamlet"
    expected:
      - path: places/the-slow-ferry.md
        line: 1
        code: V2
        message_contains: "frontmatter type: invalid value"
    rationale: >-
      The narrowest V2 seed there is: one enum field, one row. Everything else
      about the file stays valid, so this operator isolates the schema check from
      the identity checks below it.

  - operator: v2-id-stem-divergence
    code: V2
    description: A frontmatter id that no longer matches its filename stem.
    seeded_change:
      kind: replace
      path: concepts/reed-compact.md
      from: "id: reed-compact"
      to: "id: reed-pact"
    expected:
      - path: characters/osk-reeder.md
        line: 13
        code: V5
        message_contains: "[[reed-compact]] does not resolve"
      - path: concepts/reed-compact.md
        line: 1
        code: V2
        message_contains: must equal filename stem
      - path: concepts/reed-compact.md
        line: 9
        code: V11
        message_contains: affects does not name this section
      - path: places/the-slow-ferry.md
        line: 14
        code: V5
        message_contains: "[[reed-compact]] does not resolve"
    rationale: >-
      The id is the join key for three separate checks, so breaking it cascades
      on purpose. V2 catches the divergence itself; the id index now publishes
      `reed-pact`, so both inbound `[[reed-compact]]` links dangle (V5); and the
      document no longer answers to the name D-0003's `affects` reaches for, so
      its provisional section reads as unprovenanced (V11). This operator is the
      corpus's record that the three checks share one key.

  - operator: v3-status-marker-stripped
    code: V3
    description: A section whose status marker line is deleted.
    seeded_change:
      kind: replace
      path: characters/maren-holt.md
      from: "> status: ratified (D-0002)\n"
      to: ""
    expected:
      - path: characters/maren-holt.md
        line: 9
        code: V3
        message_contains: has no well-formed status marker
    rationale: >-
      A section with no marker has no standing and no provenance. V4 and V11 both
      read the marker to find citations, so a stripped marker silently removes the
      section from their reach — V3 is the only check that can see the absence,
      which is why it exists.

  - operator: v4-malformed-decision-reference
    code: V4
    description: A ratified section citing something shaped like a decision id but not one.
    seeded_change:
      kind: replace
      path: places/the-slow-ferry.md
      from: "> status: ratified (D-0001)\n\nThe ferry answers"
      to: "> status: ratified (D-0001-forged)\n\nThe ferry answers"
    expected:
      - path: places/the-slow-ferry.md
        line: 10
        code: V3
        message_contains: has no well-formed status marker
      - path: places/the-slow-ferry.md
        line: 10
        code: V4
        message_contains: cites unknown D-0001-forged
    rationale: >-
      Two findings on one line, and the pair is the record of a real divergence
      inside the validator. `check_sections` parses the marker strictly — a
      reference that is not six characters of `D-`/`Q-` plus digits invalidates
      the *whole* marker, so V3 reports the section as marker-less. `check_citations`
      scans the same line loosely, splitting on `status: ` and never validating
      reference shape, so it does see a citation and reports it unresolvable.
      Both are defensible readings; that they disagree is worth pinning, because
      a future tidy-up that unified the two parsers would silently change which
      code a repository gets.

  - operator: v4-unknown-decision-cited
    code: V4
    description: A ratified section citing a well-formed decision id that does not exist.
    seeded_change:
      kind: replace
      path: places/the-slow-ferry.md
      from: "> status: ratified (D-0001)\n\nThe ferry answers"
      to: "> status: ratified (D-0404)\n\nThe ferry answers"
    expected:
      - path: places/the-slow-ferry.md
        line: 10
        code: V4
        message_contains: cites unknown D-0404
    rationale: >-
      The citation resolves in shape but not in the ledger, so the strict and
      loose parsers agree and only V4 fires. V11 deliberately stays quiet: an
      unknown decision has no `affects` to check against, so pretending to judge
      its scope would be inventing a verdict.

  - operator: v4-closed-question-cited
    code: V4
    description: An open-question section citing a question that has been resolved.
    seeded_change:
      kind: replace
      path: characters/maren-holt.md
      from: "open-question (Q-0001)"
      to: "open-question (Q-0002)"
    expected:
      - path: characters/maren-holt.md
        line: 15
        code: V4
        message_contains: which is not open
    rationale: >-
      The legacy corpus's `cite-resolved-question`. A resolved question is not a
      live hypothesis, so a section that hangs its standing on one is citing
      nothing; the shape check (V3) cannot see it because the marker is
      well-formed.

  - operator: v4-duplicate-ledger-id
    code: V4
    description: The same decision id minted twice in the ledger.
    seeded_change:
      kind: append
      path: decisions.md
      content: |

        ## D-0002 — Wardens keep the toll rolls (filed twice)

        - status: ratified
        - affects: [[maren-holt#Standing]], [[ferry-charms#The Warden's Lesson]]

        A second entry minted under an id the ledger already carries.
    expected:
      - path: decisions.md
        line: 1
        code: V4
        message_contains: duplicate ledger id D-0002
    rationale: >-
      Ledger integrity, checked before any citation is resolved. The duplicate
      carries the same `affects` line as the original precisely so the operator
      isolates the uniqueness violation — a duplicate with different scope would
      also silently rewrite provenance, which is a different defect.

  - operator: v5-dangling-wiki-link
    code: V5
    description: A wiki-link whose target resolves to nothing in the id index.
    seeded_change:
      kind: replace
      path: places/the-slow-ferry.md
      from: "[[reed-compact]] beds"
      to: "[[reed-cmpact]] beds"
    expected:
      - path: places/the-slow-ferry.md
        line: 14
        code: V5
        message_contains: "[[reed-cmpact]] does not resolve"
    rationale: >-
      Reference integrity in the prose layer. The link is syntactically fine and
      points nowhere, which is the failure mode a formatter cannot catch.

  - operator: v5-duplicate-id
    code: V5
    description: Two files publishing the same frontmatter id.
    seeded_change:
      kind: write
      path: narratives/reed-compact.md
      content: |
        ---
        id: reed-compact
        title: Reed Compact (retelling)
        type: narrative
        status: proposed
        tags: []
        ---

        ## Retelling

        > status: proposed

        A second telling filed under an id that is already taken.
    expected:
      - path: narratives/reed-compact.md
        line: 1
        code: V5
        message_contains: duplicate id "reed-compact"
    rationale: >-
      Intra-canon uniqueness. The finding lands on the second file in the
      deterministic walk order, and the first file keeps the id — so inbound
      links still resolve and the corpus shows exactly one row, not a cascade.

  - operator: v6-unknown-era
    code: V6
    description: A timeline event citing an era the timeline does not declare.
    seeded_change:
      kind: replace
      path: data/timeline.yaml
      from: "era: toll-years"
      to: "era: brass-years"
    expected:
      - path: data/timeline.yaml
        line: 1
        code: V6
        message_contains: cites unknown era brass-years
    rationale: >-
      Referential integrity inside the structured data files, which the Markdown
      checks never look at. The YAML reader keeps no position, so every V6
      finding sits at line 1 by construction.

  - operator: v6-unparsable-yaml
    code: V6
    description: A structured data file that is not YAML.
    seeded_change:
      kind: write
      path: data/timeline.yaml
      content: |
        eras: [reed-years
        events:
          - id: first-crossing
    expected:
      - path: data/timeline.yaml
        line: 1
        code: V6
        message_contains: "invalid YAML:"
    rationale: >-
      The read path is a finding, not a panic. A corrupt data file reports once
      and the rest of the repository is still validated — the property the
      consumer's shadow harness depends on when it runs against a half-migrated
      tree.

  - operator: v6-duplicate-character-id
    code: V6
    description: The character registry carrying the same id twice.
    seeded_change:
      kind: append
      path: data/characters.yaml
      # Quoted, not a block scalar: the appended rows must keep the registry's
      # two-space list indentation, and a block scalar strips it.
      content: "  - id: maren-holt\n    name: Maren Holt (again)\n    role: ferry-warden\n    status: proposed\n"
    expected:
      - path: data/characters.yaml
        line: 1
        code: V6
        message_contains: duplicate character id maren-holt
    rationale: >-
      V6 owns uniqueness inside the registry; V7 owns the registry-to-file join.
      The duplicate row collapses in the set V7 builds, so V7 stays silent and
      this operator proves the two checks are actually separate.

  - operator: v7-registry-row-without-file
    code: V7
    description: A registry character with no matching character file.
    seeded_change:
      kind: append
      path: data/characters.yaml
      content: "  - id: brill-vane\n    name: Brill Vane\n    role: toll-clerk\n    status: proposed\n"
    expected:
      - path: data/characters.yaml
        line: 1
        code: V7
        message_contains: has no characters/brill-vane.md file
    rationale: >-
      Half of the registry/file handshake. The row is schema-valid, so V6 passes
      it; only the cross-check against the filesystem can see that the character
      does not exist as a document.

  - operator: v7-orphan-character-file
    code: V7
    description: A character file with no registry row.
    seeded_change:
      kind: write
      path: characters/brill-vane.md
      content: |
        ---
        id: brill-vane
        title: Brill Vane
        type: character
        status: proposed
        tags: []
        ---

        ## Standing

        > status: proposed

        A character document that the registry has never heard of.
    expected:
      - path: characters/brill-vane.md
        line: 1
        code: V7
        message_contains: has no registry row
    rationale: >-
      The other half, and the reason the check is symmetric: a document that no
      registry names is as broken as a registry row that names no document, and
      the finding is reported against the file rather than the registry.

  - operator: v8-banned-word-diegetic-scope
    code: V8
    description: A diegetic-scoped banned word inside an in-world text.
    seeded_change:
      kind: replace
      path: texts/ferry-charms.md
      from: "the water knows the hour"
      to: "the telephone knows the hour"
    expected:
      - path: texts/ferry-charms.md
        line: 15
        code: V8
        message_contains: banned word "telephone"
    rationale: >-
      The diegetic scope only fires on files that declare `diegetic: true`, so
      this operator also proves the scope gate: the same word in a non-diegetic
      file is not a violation. The seeded word sits on file line 15, below an
      eight-line frontmatter, and is reported at file line 15 — the absolute line
      DL-0060 corrected V8 to report. The old body-relative numbering said 8;
      pinning 15 reds if that regresses.

  - operator: v8-banned-word-all-scope
    code: V8
    description: An all-scoped banned word in an ordinary authority file.
    seeded_change:
      kind: replace
      path: concepts/reed-compact.md
      from: "and the other cutters to the common beds"
      to: "by subroutine to the common beds"
    expected:
      - path: concepts/reed-compact.md
        line: 13
        code: V8
        message_contains: banned word "subroutine"
    rationale: >-
      Scope `all` reaches every non-exempt file whether or not it is in-world.
      The seeded word sits on file line 13, below a seven-line frontmatter, and
      is reported at file line 13 — the absolute line DL-0060 corrected V8 to
      report. The old body-relative numbering said 7; pinning 13 reds if that
      regresses. Two operators over frontmatters of different heights fix the
      offset in two places, so a partial regression cannot hide.

  - operator: v10-open-question-filed-as-resolved
    code: V10
    description: A question in the open file marked resolved.
    seeded_change:
      kind: replace
      path: open-questions.md
      from: "- status: open"
      to: "- status: resolved"
    expected:
      - path: characters/maren-holt.md
        line: 15
        code: V4
        message_contains: which is not open
      - path: open-questions.md
        line: 3
        code: V10
        message_contains: expected "open"
    rationale: >-
      Placement and citability are the same fact seen twice. The question is now
      misfiled (V10) and every section citing it is citing a closed question
      (V4). The pair is the point: a repository cannot answer the placement
      finding by moving the file without also answering for the citations.

  - operator: v10-resolved-question-left-open
    code: V10
    description: A question in the resolved file still marked open.
    seeded_change:
      kind: replace
      path: resolved-questions.md
      from: "- status: resolved"
      to: "- status: open"
    expected:
      - path: resolved-questions.md
        line: 3
        code: V10
        message_contains: expected "resolved"
    rationale: >-
      The mirror case, and it is deliberately quieter: nothing cites Q-0002, so
      the misfiling produces exactly one row. The asymmetry with the operator
      above is a property of the corpus, not of the check.

  - operator: v11-forged-promotion
    code: V11
    description: A section citing a real decision that does not reach it.
    seeded_change:
      kind: replace
      path: concepts/reed-compact.md
      from: "> status: provisional (D-0003)\n\nThe compact binds"
      to: "> status: provisional (D-0001)\n\nThe compact binds"
    expected:
      - path: concepts/reed-compact.md
        line: 9
        code: V11
        message_contains: "cites D-0001, but D-0001's affects does not name this section"
    rationale: >-
      The legacy corpus's `forged-promotion`. Every earlier check passes: the
      marker is well-formed (V3) and the decision exists (V4). Only the
      section-granular `affects` cross-check can tell that D-0001 never ruled on
      this document — which is why V11 is not folded into V4.

  - operator: v11-affects-scope-stripped
    code: V11
    description: A decision's affects list narrowed so it no longer reaches a section that cites it.
    seeded_change:
      kind: replace
      path: decisions.md
      from: "- affects: [[maren-holt#Standing]], [[ferry-charms#The Warden's Lesson]]"
      to: "- affects: [[ferry-charms#The Warden's Lesson]]"
    expected:
      - path: characters/maren-holt.md
        line: 9
        code: V11
        message_contains: "cites D-0002, but D-0002's affects does not name this section"
    rationale: >-
      The same violation approached from the ledger side. Provenance is a
      two-sided claim, so editing either side breaks it, and the finding is
      always reported against the citing section — the place a reviewer can act.

  - operator: v12-unknown-register
    code: V12
    description: An in-world text declaring a register outside the closed list.
    seeded_change:
      kind: replace
      path: texts/ferry-charms.md
      from: "> kind: charm"
      to: "> kind: pamphlet"
    expected:
      - path: texts/ferry-charms.md
        line: 10
        code: V12
        message_contains: declares unknown kind "pamphlet"
    rationale: >-
      The register vocabulary is closed. An unknown register still counts as
      declared, so the passage requirement is judged against it rather than
      suppressed — one finding, not two.

  - operator: v12-missing-passage
    code: V12
    description: A quotable register with nothing quotable in it.
    seeded_change:
      kind: replace
      path: texts/ferry-charms.md
      from: "*\"A toll unwritten is a toll unpaid.\"*\n"
      to: ""
    expected:
      - path: texts/ferry-charms.md
        line: 17
        code: V12
        message_contains: is a lesson with no quotable passage
    rationale: >-
      Every register except `note` must carry at least one passage; the corpus's
      `Marginal Note` section is the standing proof that `note` is genuinely
      exempt rather than untested.

  - operator: v12-duplicate-work-id
    code: V12
    description: Two in-world texts whose titles slug to the same work id.
    seeded_change:
      kind: write
      path: texts/river-charms.md
      content: |
        ---
        id: river-charms
        title: River Charms
        type: narrative
        status: proposed
        diegetic: true
        ---

        ## The Dusk Charm

        > status: proposed
        > kind: charm

        *"Come slow; the river keeps its own hour."*
    expected:
      - path: texts/river-charms.md
        line: 9
        code: V12
        message_contains: duplicate work id "the-dusk-charm"
    rationale: >-
      Work ids are derived from titles, not declared, so two texts can collide
      without either file looking wrong on its own. The finding lands on the
      second text in walk order and names the first.

  - operator: v12-overlong-passage
    code: V12
    description: A passage long enough to be an unclosed quotation rather than a quote.
    seeded_change:
      kind: replace
      path: texts/ferry-charms.md
      from: "Come slow, come slow; the water knows the hour."
      to: "Come slow, come slow; the water knows the hour, and the reed knows the water, and the warden knows the reed, and the toll knows the warden, and the ferry knows the toll, and the dusk knows the ferry, and the flood knows the dusk, and the bed knows the flood, and the cutter knows the bed, and the rope knows the cutter, and the pole knows the rope, and the plank knows the pole, and the hull knows the plank, and the keel knows the hull, and the draft knows the keel, and the shoals know the draft, and the bar knows the shoals, and the channel knows the bar, and the mark knows the channel, and the pilot knows the mark, and the hour knows the pilot, and the bell knows the hour, and the landing knows the bell, and the road knows the landing, and the toll-house knows the road, and the roll knows the toll-house, and the clerk knows the roll, and the seal knows the clerk, and the compact knows the seal, and the beds know the compact, and the years know the beds, and the era knows the years, and the ledger knows the era, and the ruling knows the ledger, and the warden knows the ruling, and the ferry knows the warden, and the water knows the ferry, and nothing at all knows how to close this quotation before it runs past every limit the register was ever given."
    expected:
      - path: texts/ferry-charms.md
        line: 10
        code: V12
        message_contains: runs 1272 chars (max 1200)
    rationale: >-
      The length ceiling is a heuristic for an unclosed `*"` pair, and the
      message says so. It is the one V12 rule whose trigger is a threshold rather
      than a vocabulary, so the corpus pins both the trigger and the measured
      length against silent drift.
