[package]
name = "dli-lorestore"
description = "Deloreis Lore interchange store: content-addressed fact objects."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dli-core.workspace = true
