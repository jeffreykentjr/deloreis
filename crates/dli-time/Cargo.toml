[package]
name = "dli-time"
description = "Deloreis Lore Interchange time domain: chronologies, wheels, fluent timelines."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
dli-core.workspace = true
# The order-rule compiler reads `rule … over order` decls as typed AST (dli-ast);
# the world-rule datalog is pre-parsed by the front end (LS-9), and the
# order-rule micro-grammar is this crate's own domain parser over the retained
# clause text — so dli-time no longer depends on dli-syntax on the default path.
dli-ast.workspace = true
serde.workspace = true
schemars.workspace = true

[dev-dependencies]
proptest.workspace = true
# Tests and doc examples still build `.dli` source through the front end.
dli-syntax.workspace = true

[lints]
workspace = true
