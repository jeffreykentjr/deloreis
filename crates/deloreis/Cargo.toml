[package]
name = "deloreis"
description = "Check continuity in fictional worlds."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[features]
# Text authoring and rendering ship in the default build.
default = ["syntax"]
syntax = ["dep:dli-syntax", "dli-serve/syntax"]

[dependencies]
dli-ast.workspace = true
dli-core.workspace = true
dli-syntax = { workspace = true, optional = true }
dli-time.workspace = true
dli-eval.workspace = true
dli-ledger.workspace = true
dli-world.workspace = true
dli-lorestore.workspace = true
dli-export.workspace = true
dli-serve = { path = "../dli-serve", version = "0.1.0", default-features = false }
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde.workspace = true
serde_json.workspace = true
serde_saphyr.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
