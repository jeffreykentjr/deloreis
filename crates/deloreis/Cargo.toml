[package]
name = "deloreis"
description = "De Lore Is knowledge-language command-line toolchain and local worker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# LS-7: the `.dli` toolchain is opt-in. Off, `deloreis` is a 1.0-native binary —
# `serve`/`mcp` (lorestore-backed and demo corpora), `craft`, `validate-repo` —
# and links no parser. On, the `.dli` subcommands come back: `check`, `fmt`,
# `query`, `fork`, `preflight`, `timeline`, `name`, `report`, `check-proof`,
# `check-draft`, `simulate`, `export`.
syntax = ["dep:dli-syntax", "dli-serve/syntax"]

[dependencies]
dli-ast.workspace = true
dli-core.workspace = true
dli-syntax = { workspace = true, optional = true }
dli-time.workspace = true
dli-eval.workspace = true
dli-ledger.workspace = true
dli-world.workspace = true
dli-export.workspace = true
dli-sim.workspace = true
dli-game.workspace = true
dli-serve.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
