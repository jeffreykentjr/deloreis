# Killed-token registry — names/titles the ledger has VERDICT-killed.
#
# Seeded from canon/decisions.md rejections. Each token is a candidate the author
# explicitly struck down (not merely a candidate that lost to a later ratification —
# those "supersession-dead" candidates are handled by doc banners + INDEX.md, not here).
# The staleness linter (`fantasy propagate check`) flags any of these presented as a LIVE
# candidate in a `status: live` doc. Superseded/resolved/reference docs may mention them
# freely (that is the guardrail corpus); the mutation operators, ai_tics.yaml, and
# gate-coverage matrix that deliberately encode killed names for detection are code, not
# docs/**, and are never scanned by this checker.
#
# match modes:
#   word      case-insensitive, bounded by non-word/non-hyphen (default)
#   phrase    multi-word; internal whitespace flexible; same boundaries as word
#   substring case-insensitive, anywhere (use sparingly)
#   regex     raw pattern
#
# scope is the human note: what the token was killed AS, so a reviewer can judge whether
# a future re-use is genuinely the killed thing or an unrelated collision.

killed:
