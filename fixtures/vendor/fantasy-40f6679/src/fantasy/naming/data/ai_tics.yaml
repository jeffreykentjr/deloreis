  - eldora
  - eldoria
  - erebus
  - ravenwood
  - the glass weald
  - glass weald
  - rust wastes
  - the rust wastes

# --- Structural / formulaic patterns ---
patterns:
  - id: metal-noun-org
    regex: '^the (iron|silver|gold|golden|bronze|copper|obsidian|ashen|crimson|black|silent|ivory|jade|onyx) [a-z]+$'
    verdict: warn
    reason: >
      The "The [metal/colour] [noun]" faction formula is a documented AI structural
      cliche (the shape of "the Iron Ledger", "the Silver Hand"). Prefer an in-world
      institutional noun in the imperial register (a Register, an Assize, a Curia).
  - id: iron-ledger-verbatim
    regex: '^the iron ledger$'
    verdict: fail
    reason: >
      Verbatim seed-session coinage (provisional in canon, unratified as a title —
      Q-0001). Must be replaced or explicitly ratified; not accepted as a raw name.
  - id: empty-adjective-order
    regex: '^the (ancient|sacred|holy|eternal|shadow|hidden|forgotten) (order|guild|brotherhood|covenant|circle|council)$'
    verdict: warn
    reason: >
      "The [empty-adjective] [order-noun]" adds nothing the noun does not already
      imply — a documented AI filler pattern. Ground the name in the register instead.
  - id: apostrophe-shaker
    regex: "^[a-z]+'[a-z]"
    verdict: warn
    reason: >
      Apostrophe-shaker (TVTropes "Punctuation Shaker"). Use an apostrophe only for a
      real glottal stop; it reads as fantasy filler and does not survive narration.

# --- Simplistic-portent elements (D-0097) ---
# Doom-and-gloom morphemes that read as adolescent when used in a name ("doom-wight").
# Matched as substrings/tokens: FAIL at core-cast tier, WARN below. Deliberately EXCLUDES
# real onomastic elements that merely sound ominous — "grim" (ON Grimr = mask/helmet),
# "bane" (OE bana), and real fate-words like "orlog"/"wyrd" survive; those carry genuine
# etymology, the cliches below carry only mood.
portent_cliches:
  - doom
  - death
  - dark
  - shadow
  - blood
  - dread
  - gloom
  - grief
  - sorrow
  - despair
  - wraith
  - grave
  - curse
  - venom
  - abyss
  - void
  - nightmare

# --- The Tiffany problem (D-0108) ---
# Names that read modern-American to today's ear and so fail to signal the pre-modern
# fantasy genre — EVEN when historically authentic (Jo Walton's "Tiffany problem":
# Tiffany = medieval Theophania; Audrey = Old English Aethelthryth). A core-cast name
# must also signal the genre, so these FAIL at core-cast tier, WARN below. Curated to
# modern-Anglo first names; genre-appropriate real names (Welsh Nia/Mair, Irish Aodh,
# Norse Ketil) are deliberately NOT here. Extend as drafting surfaces new ones.
anachronistic_names:
  # The named exemplars (author + Jo Walton)
  - tiffany
  - audrey
  - samantha
  - chad
  - shane
