# AI naming-tic blocklist for the naming oracle.
#
# The model that seeded this world has documented naming tics (it invented "Silas"
# twice and reached for "the Iron Ledger"). This file encodes the community-documented
# cluster of AI-overused names plus the structural "The [metal] [noun]" org formula.
# Sources: docs/research/RR-003-naming.md section 3.
#
# - `names`: exact/near AI-favourite given names and surnames. An exact match FAILS;
#   a fuzzy near-miss (edit distance / phonetic key) WARNS.
# - `places`: AI-overused place names (exact FAIL, near WARN).
# - `patterns`: regex rules (case-insensitive, matched against the whole name). A hit
#   is a WARN for the structural cliche, FAIL for a verbatim seeded tic.
#
# The seed-session names (Silas, Kaelen, Oona, Cerys, Jorin, Iron Ledger, Glass Weald,
# Rust Wastes, biome placeholders) are listed so the pipeline flags them as the
# non-canonical inputs they are — they must pass vetting or be replaced (see WORKFLOW).

# --- AI-favourite given names / surnames (community-documented) ---
names:
  # The flagship cluster (Namerology "Name of the Year"; Max Read "promptonyms")
  - elara
  - lyra
  - kael
  - kaelen
  - kaelith
  - silas
  - thorne
  - aris
  - seraphina
  - aria
  - elian
  - elias
  - elena
  - anya
  - althea
  - maeve
  - nyx
  - zephyr
  - lyric
  - nova
  - luna
  - sage
  - eira
  - isolde
  - rowan
  - ember
  # Cornell/Hamilton-Mimno LLM default-name study (404media 2026): the "Elias Thorne"
  # cluster appears in a huge share of AI stories across every major model. Elara/Thorne/
  # Elias are already listed above; adding the study's other headliner.
  # Sources: https://www.404media.co/elias-thorne-chatbots-llms-chatgpt-lighthouse-keeper-story/
  #          https://arxiv.org/abs/2510.15061 (antislop: Elara measured 85,513x over human baseline)
  - mara
