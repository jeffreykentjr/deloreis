# Systematic Tiffany-problem data (D-0129).
#
# A curated list loses this game — "Marcia" slipped past after "Audrey" was caught. So
# the anachronism check is now backed by a USAGE-FREQUENCY list: the most common
# given names of the 20th-century United States. Any core-cast GIVEN name that reads
# modern-common to a contemporary ear fails core-cast, regardless of medieval pedigree
# (Tiffany = Theophania; Audrey = Aethelthryth) — because a core-cast name must also
# SIGNAL the genre.
#
# Provenance: aggregated from U.S. Social Security Administration given-name popularity
# data (public domain; https://www.ssa.gov/oact/babynames/) — the top ~few-hundred male
# and female names across the 20th century, hand-compiled here (the SSA site blocks
# automated fetch). This is a frequency signal, not an exhaustive census; extend as
# needed. Matching is a normalized set lookup on the candidate's first (given) token.
#
# `whitelist`: names the AUTHOR has personally cleared, or that are unambiguously
# genre-native (Welsh/Irish/Norse), which must PASS even if they appear in modern data
# (e.g. Nia is common in the SSA data but is the author-blessed protagonist-given
# direction). The whitelist overrides the common list, per token.

whitelist:
  # author-blessed / on-the-record from the batches
  - nia
  - sig
  - livia
  - fennon
  - aalto
  - ketilson
  - webster
  - limner
  # ratified places (harmless as given-name whitelist, kept for completeness)
  - whitecombe
