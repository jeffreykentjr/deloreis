# Diegetic glossary. Terms the world itself uses.
# ratified/provisional terms cite a decision; proposed terms carry none.

terms:
  - term: Wyrd
    gloss: >
      (pron. "weird", from Old English wyrd, "that which has come to pass.") The living
      web of cause and consequence binding soil, weather, beasts, and people — the
      world's own memory and law. Not fate as prophecy; fate as accumulated
      consequence. Healthy Wyrd is invisible and quiet.
    status: ratified
    decision: D-0048

  - term: Frith
    gloss: >
      (Old English/Norse: peace, protection, right relation.) The law of reciprocity —
      what is taken must be balanced by what is given. Sin in the old sense: taking
      more than you return.
    status: ratified
    decision: D-0048

  - term: geas
    gloss: >
      (pl. geasa; from Irish tradition.) A binding spoken obligation or taboo. Breaking
      one does not merely fail — it rebounds. The empire binds village headmen with
      state geasa as living gag orders.
    status: provisional
    decision: D-0072

  - term: landvættir
    gloss: >
      (Norse: land-wights.) The spirits of specific places — stones, bogs, rivers,
      groves. Neither good nor evil; parties to old agreements, dangerous when those
      agreements are broken.
    status: provisional
    decision: D-0072

  - term: axiomatic debt
    gloss: >
      The accumulating imbalance created when false premises are forced onto the Wyrd —
      extraction without reciprocity. It does not dissipate; it sours soil, breaks
      seasons, and eventually takes bodily form.
    status: provisional
    decision: D-0072

  - term: the Plenty
    gloss: >
      The empire's self-perpetuating framework of written law, quota, and tithe —
      named in doublespeak: the promise of abundance naming the machine of
      obsolescence (D-0131). Said with reverence in the keeps and dread in the
      parishes.
    status: ratified
    decision: D-0132

  - term: the Iron Ledger
    gloss: >
      Retired as the framework's name (superseded by the Plenty, D-0132) and as a
      title candidate (the series title is To Pleach the Hedgeway, D-0143). May
      survive as an in-world phrase for the physical ledgers.
    status: provisional
    decision: D-0072

  - term: Wyrd-storm
    gloss: >
      A weather-scaled eruption of unresolved contradiction in the land: rain that
      bites, fog that eats memory, seasons breaking their order.
    status: provisional
    decision: D-0072

  - term: Wyrd-rot
    gloss: >
      The slow sickness — in flesh, soil, or timber — of living inside accumulated
      axiomatic debt. Occupational disease of miners, tanners, and scribes alike.
    status: provisional
    decision: D-0072

  - term: hedge-fair
    gloss: >
      An illegal pop-up night market at a liminal place (crossroads, dry ford), trading
      by Frith rather than coin: untainted seed, smuggled iron, whispered histories.
    status: provisional
    decision: D-0072

  - term: the Tithe of Minds
    gloss: >
      The empire's periodic conscription of gifted peripheral children for training as
      living calculators in the keeps. How the protagonist was taken.
    status: provisional
    decision: D-0072

  - term: skald
    gloss: >
      An outlawed oral historian and memory-keeper; carrier of the old axioms in
      rhyming, error-resistant meter.
    status: provisional
    decision: D-0072

  - term: keep
    gloss: >
      A lord's fortified seat: granary, scriptorium, ward-anchor, and hoard. The
      insulated high ground of the ruling order.
    status: provisional
    decision: D-0072

  - term: hearthless
    gloss: >
      The dispossessed underclass — those legally stripped of ancestral hearths who
      wander between labor camps trading work for shelter.
    status: provisional
    decision: D-0072

  - term: sin-eater
    gloss: >
      (From Welsh/English folklore.) A desperate laborer paid to absorb a household's
      or village's small paradoxes into their own body, sparing the community at the
      cost of their own slow ruin.
    status: provisional
    decision: D-0031

  - term: keener
    gloss: >
      (From the Irish bean chaointe.) A professional mourner whose trained wail
      discharges the stagnant grief of a place before it curdles into something worse.
    status: provisional
    decision: D-0031

  - term: Thread-Reader
    gloss: >
      A scholar-religious of the far-future orders who decode the surviving woven and
      knotted records of the story's era. The narrator is one. (Order name and titles
      are AI-proposed, unconfirmed.)
    status: proposed

  - term: the Turning
    gloss: >
      The world's oracular deck: a commons reckoning-game that turned to counsel, read as a
      wheel of Grounds, Hands, and Weathers, never a ranked climb. Laid to hold a problem still
      and return a better question, never a fortune. Its everyday name drifts by region; "the
      Turning" is the heartland word — for the wheel that turns bloom to rot and back.
    status: ratified
    decision: D-0148

  - term: the Grounds
    gloss: >
      The Turning's region-drifting suits — the commons-domains one can owe (the Wood, the
      Water, the Field, the Hearth, and their regional kin). A Ground is the subject of a
      reading and the grounds of an argument at once: a leaf is a holdable premise.
    status: ratified
    decision: D-0148

  - term: the Hands
    gloss: >
      The Turning's four court-roles, the moments of the Frith-cycle: the Taker (draws), the
      Keeper (holds), the Giver (returns), the Mender (repairs). Not social ranks; the cards
      themselves teach the round of take, keep, give back, mend. Their faces are folk-figures
      that drift by region.
    status: ratified
    decision: D-0148

  - term: the Weathers
    gloss: >
      The Turning's ring of cyclical conditions — the not-fate weather that falls on any Ground
      (the Greening and the Rot, the Flood and the Dearth, the Binding and the Loosing, the
      Mending and the Sundering, the Road, the Bourn, the Debt, the Fallow). A closed ring with
      no highest card: the Rot leads back round to the Greening.
    status: ratified
    decision: D-0148

  - term: the Reckoner
    gloss: >
      The Turning's hub leaf: the querent's own standpoint, which makes every reading
      self-implicating. The anti-Fool — a still centre that must choose which way to turn, never
      a wanderer stepping off a cliff.
    status: ratified
    decision: D-0148

  - term: a round
    gloss: >
      One deal or reading of the Turning (lowercase common noun); also the everyday three-leaf
      spread. The full turn is "the whole round." Layouts carry names because a layout is the
      shape of an argument.
    status: ratified
    decision: D-0148
