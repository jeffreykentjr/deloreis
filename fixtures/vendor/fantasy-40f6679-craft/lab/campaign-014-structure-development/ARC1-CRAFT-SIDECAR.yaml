        kind: inquiry
        open_beat: arc1.ep05.s1
        close_beat: arc1.ep05.s3
      - id: arc1.ep05.mice.character
        kind: character
        open_beat: arc1.ep05.s2
        close_beat: arc1.ep05.s2
    tryfail_beats:
