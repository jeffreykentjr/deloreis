id: act1.arc1
title: The First Working Household
episodes:
  - id: arc1.ep01
    title: The Wrong Fibre
    hook_by_seconds: 25
    ki: "Aalto works alone over a sick kinsman's bed, trying to re-tie a failing storm-ward before the night tide."
    sho: "Enfys arrives because Aalto's failed knot still carries a cleaner argument than the keep-stamped cord can bear."
    ten: "The ward failed because correct local craft was asked to hold in false material against a soured valley."
    ketsu: "Aalto keeps Enfys breathing after the Archive overwhelms her; the first bond forms around mutual competence, not rescue."
    scenes:
      - id: arc1.ep01.s1
        summary: "Aalto reties the failing storm-ward over the sick bed and hears the cord slip before the weather breaks."
        speaking_cast: ["Aalto"]
        advances: [plot, revelation]
        silence_beat: true
      - id: arc1.ep01.s2
        summary: "Enfys arrives because the failed knot still shows a clean argument inside bad material."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [plot, relationship, revelation]
      - id: arc1.ep01.s3
        summary: "After the Archive overload, Aalto tends Enfys's breath and chooses competence over panic."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [relationship]
        silence_beat: true
    promises:
      - id: arc1.ep01.promise.enfys_matters
        kind: character
        statement: "Enfys matters because she can read the clean argument inside the failed local craft."
        made_in: arc1.ep01.s1
        payoff_ref: arc1.ep01.s2
      - id: arc1.ep01.promise.why_ward_failed
        kind: mystery
        statement: "The ward failed for a material and local reason that is not yet fully known."
        made_in: cold-open
        open_loop_carry: true
      - id: arc1.ep01.promise.what_enfys_carries
        kind: character
        statement: "Enfys carries too much history in the Archive for her body to bear cleanly."
        made_in: arc1.ep01.s3
        open_loop_carry: true
      - id: arc1.ep01.promise.household_formed
        kind: umbrella
        statement: "The opening will test whether a working household can form from competence rather than rescue."
        made_in: arc1.ep01.s3
        open_loop_carry: true
    mice_threads:
      - id: arc1.ep01.mice.event
        kind: event
        open_beat: arc1.ep01.s1
        close_beat: arc1.ep01.s3
      - id: arc1.ep01.mice.inquiry
        kind: inquiry
        open_beat: arc1.ep01.s2
        close_beat: arc1.ep01.s2
    tryfail_beats:
      - id: arc1.ep01.try.1
        attempt: "Seat the keep-stamped cord in the old ward logic."
        outcome: "no-and"
      - id: arc1.ep01.try.2
        attempt: "Let Enfys read the failure before the ward collapses."
        outcome: "yes-but"
      - id: arc1.ep01.try.3
        attempt: "Keep Enfys breathing after the Archive overwhelms her."
        outcome: "yes-and"
    loops_opened:
      - first_night_survival
      - why_the_ward_failed
      - what_enfys_carries
      - why_aalto_goes
      - opening_household_formed
    loops_closed: []
    season_boundary: true

  - id: arc1.ep02
    title: A Bed Above Water
    hook_by_seconds: 40
    ki: "After the night tide, Aalto counts food, dry boards, useful cord, death-work, and the stranger asleep too still by the hearth."
    sho: "Enfys wakes courteous and depleted, with brief slips of other voices and hands; the leaves steady her rather than answer Aalto."
    ten: "Aalto stops reading Enfys as a failed rescuer and sees another damaged body that needs tending."
    ketsu: "They bundle what can be carried toward Trefpen without calling the movement adoption."
    scenes:
      - id: arc1.ep02.s1
        summary: "Aalto measures the flooded room, the food, and the dry height left after the night tide."
        speaking_cast: ["Aalto"]
        advances: [plot]
        silence_beat: true
      - id: arc1.ep02.s2
        summary: "Enfys wakes with borrowed voices close under her own courtesy, and the leaves steady her hands."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [relationship, revelation]
      - id: arc1.ep02.s3
        summary: "Aalto packs only what can be carried and names Trefpen as shelter, not adoption."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [plot, relationship]
    promises:
      - id: arc1.ep02.promise.enfys_tended
        kind: relationship
        statement: "Aalto will tend Enfys as another damaged body, not as a failed authority."
        made_in: arc1.ep02.s2
        payoff_ref: arc1.ep02.s3
      - id: arc1.ep02.promise.trefpen_shelter
        kind: mystery
        statement: "Trefpen may offer shelter, but the terms of that shelter are not yet known."
        made_in: arc1.ep02.s3
        open_loop_carry: true
    mice_threads:
      - id: arc1.ep02.mice.milieu
        kind: milieu
        open_beat: arc1.ep02.s1
        close_beat: arc1.ep02.s3
      - id: arc1.ep02.mice.character
        kind: character
        open_beat: arc1.ep02.s2
        close_beat: arc1.ep02.s2
    tryfail_beats:
      - id: arc1.ep02.try.1
        attempt: "Count the house as if ordinary household arithmetic can still hold."
        outcome: "no-and"
      - id: arc1.ep02.try.2
        attempt: "Ask Enfys for clean answers while she is still damaged."
        outcome: "no-but"
      - id: arc1.ep02.try.3
        attempt: "Choose a carryable road plan instead of a total solution."
        outcome: "yes-but"
    loops_opened:
      - enfys_must_be_tended
      - trefpen_as_next_shelter
      - road_to_trefpen
    loops_closed:
      - first_night_survival

  - id: arc1.ep03
    title: The Spring Below the Path
    hook_by_seconds: 35
    ki: "Before they can use the road, Aalto finds the spring cannot be trusted for drinking, carrying, or giving to Enfys."
    sho: "Taste, silence, mud, and a sample vessel prove the wrongness before Enfys brings in cord and leaves."
    ten: "The spring behaves like a shared source and a fenced holding at once, revealing an incompatible account in the land."
    ketsu: "They leave the spring unhealed but legible: sample sealed, path marked, and the water case named as something to return to."
    scenes:
      - id: arc1.ep03.s1
        summary: "Aalto finds the spring cannot be trusted for drink, carrying, or care."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [plot, revelation]
      - id: arc1.ep03.s2
        summary: "Taste, mud, silence, and a sample vessel establish wrongness before leaves enter."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [relationship, revelation]
      - id: arc1.ep03.s3
        summary: "They seal a sample, mark the path, and name the water case as something to return to."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [plot]
        silence_beat: true
    promises:
      - id: arc1.ep03.promise.spring_legible
        kind: mystery
        statement: "The sour spring is materially unusable in a way that can be tracked later."
        made_in: arc1.ep03.s1
        payoff_ref: arc1.ep03.s3
      - id: arc1.ep03.promise.gwern_water_wrong
        kind: umbrella
        statement: "Gwern's water problem is an Act 1 case, not an opening-arc cure."
        made_in: arc1.ep03.s3
        open_loop_carry: true
    mice_threads:
      - id: arc1.ep03.mice.inquiry
        kind: inquiry
        open_beat: arc1.ep03.s1
        close_beat: arc1.ep03.s3
      - id: arc1.ep03.mice.character
        kind: character
        open_beat: arc1.ep03.s2
        close_beat: arc1.ep03.s2
    tryfail_beats:
      - id: arc1.ep03.try.1
        attempt: "Treat the spring as usable road water despite the bad taste."
        outcome: "no-and"
      - id: arc1.ep03.try.2
        attempt: "Read it through physical evidence before Enfys brings in leaves."
        outcome: "yes-but"
      - id: arc1.ep03.try.3
        attempt: "Make the spring legible enough to return to it."
        outcome: "yes-and"
    loops_opened:
      - gwern_water_wrong
      - spring_sample_thread
    loops_closed:
      - enfys_must_be_tended

  - id: arc1.ep04
    title: Two Leaves for the Road
    hook_by_seconds: 45
    ki: "In a borrowed corner of Trefpen, a host grants shelter for one night only and forces the next-road choice."
    sho: "Enfys lays two leaves as two practical roads with costs, while Aalto resists treating them as command."
    ten: "The leaves expose the avoided question: what can be carried without becoming a burden, and what must be left without betrayal."
    ketsu: "Aalto chooses the next road by hand: keep the borrowed hearth for the night, then carry the spring question into Trefpen."
    scenes:
      - id: arc1.ep04.s1
        summary: "A borrowed-hearth host gives them a corner for one night, but no lasting standing."
        speaking_cast: ["Aalto", "Enfys", "borrowed-hearth host"]
        advances: [plot]
      - id: arc1.ep04.s2
        summary: "Enfys lays two leaves as practical choices, and Aalto resists treating either as command."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [relationship, revelation]
      - id: arc1.ep04.s3
        summary: "Aalto keeps the hearth for the night and chooses the next road as ordinary action."
        speaking_cast: ["Aalto", "Enfys"]
        advances: [plot, relationship]
    promises:
      - id: arc1.ep04.promise.counsel_not_fate
        kind: core
        statement: "The Turning can frame practical choices without commanding either one."
        made_in: arc1.ep04.s2
        payoff_ref: arc1.ep04.s3
      - id: arc1.ep04.promise.what_aalto_leaves
        kind: character
        statement: "Aalto's leaving must remain ethically active rather than cleanly solved."
        made_in: arc1.ep04.s3
        open_loop_carry: true
    mice_threads:
      - id: arc1.ep04.mice.character
        kind: character
        open_beat: arc1.ep04.s1
        close_beat: arc1.ep04.s3
      - id: arc1.ep04.mice.inquiry
        kind: inquiry
        open_beat: arc1.ep04.s2
        close_beat: arc1.ep04.s2
    tryfail_beats:
      - id: arc1.ep04.try.1
        attempt: "Take the borrowed hearth as a settled answer."
        outcome: "no-and"
      - id: arc1.ep04.try.2
        attempt: "Ask the leaves to command the road."
        outcome: "no-but"
      - id: arc1.ep04.try.3
        attempt: "Use the leaves to choose a next action without surrendering agency."
        outcome: "yes-and"
    loops_opened:
      - turning_counsel_not_fate
