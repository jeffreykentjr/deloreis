    sho: "The seller argues stamped sameness as mercy while Aalto tests by hand, breath, salt, and weather-sense."
    ten: "The best-looking cord passes the store's measure while failing the simplest seating test against weather."
    ketsu: "A hidden scrap of true old fibre becomes more trustworthy than any official length."
    scenes:
