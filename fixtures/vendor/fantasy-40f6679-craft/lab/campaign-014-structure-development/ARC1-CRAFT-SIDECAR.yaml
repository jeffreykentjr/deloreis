  - id: arc1.ep05
    title: The Parish That Blamed the Wind
    hook_by_seconds: 50
    ki: "Trefpen offers safe explanations for the storm: bad rites, poor cord, unpaid tithe, a child's presumption, the wind."
    sho: "A household ward case gives Enfys the first full counsel reading while Aalto listens for who each explanation protects."
    ten: "Every neat answer clears the parish rolls and lays fault on someone hungry, widowed, young, or tired."
    ketsu: "Aalto learns to distrust any account of shared harm that becomes tidy only after blaming the least powerful hand."
    scenes:
      - id: arc1.ep05.s1
        summary: "A frightened ward-keeper brings a safe explanation that shifts fault onto weather and weakness."
        speaking_cast: ["Aalto", "Enfys", "frightened ward-keeper"]
        advances: [plot]
      - id: arc1.ep05.s2
        summary: "Enfys gives a counsel reading while Aalto listens for who the tidy account protects."
        speaking_cast: ["Aalto", "Enfys", "frightened ward-keeper"]
        advances: [revelation, relationship]
      - id: arc1.ep05.s3
        summary: "Aalto returns the local a better question instead of a verdict."
        speaking_cast: ["Aalto", "Enfys", "frightened ward-keeper"]
        advances: [plot, relationship]
    promises:
      - id: arc1.ep05.promise.blame_logic
        kind: core
        statement: "A tidy blame account protects power by naming the weakest hand as cause."
        made_in: arc1.ep05.s1
        payoff_ref: arc1.ep05.s3
      - id: arc1.ep05.promise.ward_keeper_case
        kind: character
        statement: "The ward-keeper's fear may become later testimony or learning."
        made_in: arc1.ep05.s3
        open_loop_carry: true
    mice_threads:
